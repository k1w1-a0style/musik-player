name: One-shot standalone APK

on:
  push:
    branches: [codex]
    paths:
      - ".github/workflows/one-shot-standalone-apk-2026-08-23.yml"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/eas-build.yml
    with:
      ref: 432f3a88776fc225dca798b33feb6a063055d929
      profile: preview
      platform: android
      autofix: false
      strict_lockfile: "true"
    secrets: inherit
