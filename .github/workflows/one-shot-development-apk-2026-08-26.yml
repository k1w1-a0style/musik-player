name: One-shot development APK and emulator smoke 2026-08-26

on:
  push:
    branches: [codex]
    paths:
      - ".github/workflows/one-shot-development-apk-2026-08-26.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-development-apk-2026-08-26
  cancel-in-progress: false

jobs:
  development-apk-smoke:
    name: Build, inspect, install and launch current development APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PACKAGE_NAME: com.k1w1a0style.musikplayer.dev
      AVD_NAME: musik-player-api-35
      ANDROID_API: "35"
      EAS_BUILD_PROFILE: development
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 5cf3acdfef55d70a3d5d35431da4caf21a4a1c35
          persist-credentials: false

      - name: Record source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts ci-logs
          git rev-parse HEAD | tee artifacts/source-commit.txt
          test "$(git rev-parse HEAD)" = "5cf3acdfef55d70a3d5d35431da4caf21a4a1c35"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 20.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Select JDK 17
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Build development APK with EAS locally
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          eas build \
            --platform android \
            --profile development \
            --local \
            --non-interactive \
            --output "$PWD/artifacts/k1w1-musik-development-5cf3acdf.apk" \
            2>&1 | tee android-development-build.log

      - name: Inspect development APK
        shell: bash
        run: |
          set -euo pipefail
          APK=artifacts/k1w1-musik-development-5cf3acdf.apk
          test -s "$APK"
          node scripts/ci/inspectAndroidApk.cjs "$APK" \
            --expected-package "$PACKAGE_NAME" \
            --expected-label "k1w1-Musik" \
            --min-size-bytes 10000001 \
            --require-badging \
            --require-signature \
            | tee android-development-apk-inspection.log
          sha256sum "$APK" | tee artifacts/SHA256SUMS.txt

      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'emulator' \
            "system-images;android-${ANDROID_API};google_apis;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-${ANDROID_API};google_apis;x86_64" \
            --device pixel_6

      - name: Boot emulator, install and launch APK
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > ci-logs/emulator.log 2>&1 &
          echo $! > ci-logs/emulator.pid

          if ! timeout 180 adb wait-for-device; then
            tail -n 160 ci-logs/emulator.log || true
            exit 1
          fi
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb logcat -c

          APK=artifacts/k1w1-musik-development-5cf3acdf.apk
          adb install -r "$APK" | tee ci-logs/adb-install.log
          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start -W -n "$PACKAGE_NAME/.MainActivity" | tee ci-logs/adb-launch.log
          sleep 10

          pid="$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"
          test -n "$pid"
          echo "appPid=$pid" | tee ci-logs/app-process.log
          adb shell dumpsys activity activities > ci-logs/dumpsys-activities.txt
          grep -F "$PACKAGE_NAME" ci-logs/dumpsys-activities.txt >/dev/null
          adb shell screencap -p > ci-logs/app-launch.png
          adb logcat -d -v threadtime > ci-logs/logcat.txt
          if grep -A20 -B5 -F "Process: ${PACKAGE_NAME}," ci-logs/logcat.txt; then
            echo "::error::The development APK crashed during launch smoke."
            exit 1
          fi

      - name: Upload APK and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-development-apk-5cf3acdf
          path: |
            artifacts/**
            android-development-build.log
            android-development-apk-inspection.log
            ci-logs/**
          if-no-files-found: warn
          retention-days: 5
