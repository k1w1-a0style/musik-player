name: One-shot Expo cloud development build

on:
  push:
    branches:
      - codex
    paths:
      - .github/workflows/one-shot-expo-cloud-development-2026-08-12.yml

permissions:
  contents: read

concurrency:
  group: one-shot-expo-cloud-development-codex
  cancel-in-progress: false

jobs:
  build:
    name: Build development APK on EAS Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI_VERSION: "20.0.0"
    steps:
      - name: Checkout codex
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Expo token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Install pinned EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "eas-cli@${EAS_CLI_VERSION}"
          eas --version
          eas whoami

      - name: Start and await EAS Cloud development build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          eas build \
            --platform android \
            --profile development \
            --non-interactive \
            --wait 2>&1 | tee ci-logs/eas-cloud-development-build.log

      - name: Upload EAS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-cloud-development-build-diagnostics
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 5
