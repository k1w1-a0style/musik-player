# managed-by: k1w1
# workflow-version: 406
# manual-fallback-only: true
name: Release Build (WAIT)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options: [ production, preview, development ]
        default: production
      ref:
        description: "Branch/Tag/SHA to build"
        required: true
      strict_lockfile:
        description: "Lockfile policy override (auto|true|false)"
        required: false
        type: choice
        options: [ auto, "true", "false" ]
        default: auto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and authorize release ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release ref against trusted history
        id: resolve
        shell: bash
        env:
          RAW_REF: ${{ inputs.ref }}
          RAW_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          REF="$(printf '%s' "$RAW_REF" | tr -d '\r\n')"
          PROFILE="$(printf '%s' "$RAW_PROFILE" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"

          if [[ "$REF" != "codex" && "$REF" != "main" && ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid ref: only codex, main, or a full 40-character SHA is allowed."
            exit 1
          fi
          case "$PROFILE" in
            development|preview|production) ;;
            *) echo "::error::Invalid profile '$PROFILE'."; exit 1 ;;
          esac

          git fetch --no-tags origin \
            '+refs/heads/codex:refs/remotes/origin/codex' \
            '+refs/heads/main:refs/remotes/origin/main'
          CODEX_SHA="$(git rev-parse --verify refs/remotes/origin/codex^{commit})"
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          case "$REF" in
            codex) RESOLVED_SHA="$CODEX_SHA" ;;
            main) RESOLVED_SHA="$MAIN_SHA" ;;
            *)
              if ! git cat-file -e "${REF}^{commit}" 2>/dev/null; then
                echo "::error::Requested SHA is not present in trusted codex/main history."
                exit 1
              fi
              RESOLVED_SHA="$(git rev-parse --verify "${REF}^{commit}")"
              ;;
          esac

          case "$PROFILE" in
            development)
              git merge-base --is-ancestor "$RESOLVED_SHA" "$CODEX_SHA" || {
                echo "::error::Development builds must use a commit reachable from codex."; exit 1;
              }
              ;;
            preview)
              if ! git merge-base --is-ancestor "$RESOLVED_SHA" "$CODEX_SHA" \
                && ! git merge-base --is-ancestor "$RESOLVED_SHA" "$MAIN_SHA"; then
                echo "::error::Preview builds must use a commit reachable from codex or main."
                exit 1
              fi
              ;;
            production)
              if [ "$RESOLVED_SHA" != "$MAIN_SHA" ]; then
                echo "::error::Production builds must use the exact current main head."
                exit 1
              fi
              ;;
          esac

          printf 'ref=%s\nprofile=%s\n' "$RESOLVED_SHA" "$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Authorized $PROFILE release ref $REF as $RESOLVED_SHA."

  build:
    needs: resolve
    if: ${{ vars.ENABLE_CLOUD_EAS_BUILDS == 'true' }}
    name: Android Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI_VERSION: "16.32.0"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY: ${{ secrets.K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY }}
      WORKFLOW_VERSION: "406"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Validate secrets + inputs
        shell: bash
        run: |
          set -euo pipefail

          case "${GH_PROFILE_8777ED}" in
            development|preview|production) ;;
            *) echo "::error::Invalid profile: '${GH_PROFILE_8777ED}'"; exit 1 ;;
          esac

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

          if [ "${GH_PROFILE_8777ED}" = "production" ]; then
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY:-}" ]; then
              echo "::error::Production profile uses local Android credentials. Missing SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY."
              exit 1
            fi
          fi

          ARTIFACT_EXT="apk"
          echo "ARTIFACT_EXT=${ARTIFACT_EXT}" >> "$GITHUB_ENV"
        env:
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}

      - name: Detect package manager / lockfile
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=package-lock.json"
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          elif [ -f npm-shrinkwrap.json ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=npm-shrinkwrap.json"
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=yarn.lock"
              echo "package_manager=yarn"
            } >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=pnpm-lock.yaml"
              echo "package_manager=pnpm"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_lockfile=false"
              echo "lockfile_path="
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (npm cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (yarn cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'yarn'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (pnpm cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'pnpm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (no cache - lockfile missing)
        if: steps.lock.outputs.has_lockfile != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Determine strict lockfile policy
        id: strict_lock
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${GH_PROFILE_8777ED}"
          OVERRIDE="${GH_STRICT_LOCKFILE_02D8DA}"
          case "$OVERRIDE" in
            true)
              echo "strict=true" >> "$GITHUB_OUTPUT"
              ;;
            false)
              if [ "$PROFILE" != "development" ]; then
                echo "::error::strict_lockfile=false is only allowed for development profile in release workflow. Preview/production remain fail-closed."
                exit 1
              fi
              echo "strict=false" >> "$GITHUB_OUTPUT"
              ;;
            ""|auto)
              case "$PROFILE" in
                preview|production)
                  echo "strict=true" >> "$GITHUB_OUTPUT"
                  ;;
                development)
                  echo "strict=false" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "::error::Unknown profile '$PROFILE' while computing strict lockfile policy"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Invalid strict_lockfile override '$OVERRIDE' (allowed: auto|true|false)"
              exit 1
              ;;
          esac
        env:
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}
          GH_STRICT_LOCKFILE_02D8DA: ${{ inputs.strict_lockfile }}

      - name: Install deps (package-manager-aware)
        id: install_deps
        shell: bash
        env:
          STRICT_LOCKFILE: ${{ steps.strict_lock.outputs.strict }}
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}
          GH_PACKAGE_MANAGER_9162DF: ${{ steps.lock.outputs.package_manager }}
          GH_HAS_LOCKFILE_7F5283: ${{ steps.lock.outputs.has_lockfile }}
        run: |
          set -euo pipefail

          PROFILE="${GH_PROFILE_8777ED}"
          PM="${GH_PACKAGE_MANAGER_9162DF}"
          if [ "${GH_HAS_LOCKFILE_7F5283}" = "true" ]; then
            case "$PM" in
              npm)
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                npm ci --no-audit --no-fund
                ;;
              yarn)
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                corepack enable || true
                yarn install --immutable
                ;;
              pnpm)
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                corepack enable || true
                pnpm install --frozen-lockfile
                ;;
              *)
                echo "::error::Unknown package manager '$PM'"
                exit 1
                ;;
            esac
          elif [ "${STRICT_LOCKFILE}" = "true" ]; then
            echo "::error::Strict lockfile policy enabled for profile '${PROFILE}', but no lockfile was found. Commit package-lock.json, npm-shrinkwrap.json, yarn.lock or pnpm-lock.yaml before running preview/production builds."
            exit 1
          else
            echo "::warning::No lockfile found in repo. Development profile allows fallback to npm install (non-reproducible)."
            echo "mode=fallback-npm-install" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          fi

      - name: Install EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          npm i -g "eas-cli@${EAS_CLI_VERSION}"
          eas --version
          eas whoami

      - name: Export Android signing files (production only)
        if: inputs.profile == 'production'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          BODY="$(node -e 'process.stdout.write(JSON.stringify({repo:process.env.GITHUB_REPOSITORY,mode:"production"}))')"
          HTTP_CODE="$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 60 \
            --output ci-logs/keystore-response.raw.json --write-out '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/functions/v1/android-keystore-export" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-k1w1-admin-key: ${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY}" \
            --data "${BODY}")"
          node scripts/ci/summarizeKeystoreResponse.cjs \
            ci-logs/keystore-response.raw.json \
            ci-logs/keystore-response.summary.json \
            "${HTTP_CODE}"
          node scripts/ci/writeAndroidSigningFilesFromExport.cjs < ci-logs/keystore-response.raw.json
          test -f credentials.json
          test -f android-upload-keystore.p12

      - name: Run EAS build (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="${GH_PROFILE_8777ED}"
          echo " Starting EAS build (platform=android, profile=${PROFILE}) with --wait..."

          BUILD_OUTPUT=""
          BUILD_OUTPUT="$(eas build --platform android --profile "${PROFILE}" --non-interactive --wait 2>&1)" || {
            CODE=$?
            printf '%s\n' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs redact-urls
            echo "::error::EAS build failed (exit ${CODE})"
            exit "${CODE}"
          }

          printf '%s\n' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs redact-urls

          BUILD_ID="$(printf '%s' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs extract-build-id)"
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::EAS build completed without a build ID; refusing to publish an unverified Android artifact."
            exit 1
          fi

          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
        env:
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}

      - name: Download Android Artifact
        id: download_artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          OUT="build/k1w1-${GH_PROFILE_8777ED}.${ARTIFACT_EXT}"
          BUILD_ID="${GH_BUILD_ID_E68394}"
          PROFILE="${GH_PROFILE_8777ED}"
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::Missing the current EAS build ID; refusing to download."
            exit 1
          fi
          case "${PROFILE}" in
            development|preview|production) EXPECTED_DISTRIBUTION="internal" ;;
            *) echo "::error::Unexpected build profile."; exit 1 ;;
          esac
          BUILD_JSON="$(mktemp)"
          trap 'rm -f "${BUILD_JSON}"' EXIT
          eas build:view "${BUILD_ID}" --json > "${BUILD_JSON}"
          ARTIFACT_URL="$(node scripts/ci/resolveEasBuildArtifact.cjs artifact-url \
            "${BUILD_ID}" "${PROFILE}" "${PROFILE}" "${EXPECTED_DISTRIBUTION}" < "${BUILD_JSON}")"
          rm -f "${BUILD_JSON}"
          echo "Validated structured EAS artifact metadata (URL present, value redacted)."
          rm -f "${OUT}"
          curl --fail --location --retry 3 --retry-delay 5 --output "${OUT}" "${ARTIFACT_URL}"
          if ! test -s "${OUT}"; then
            echo "::error::Release build did not produce a non-empty Android artifact at ${OUT}."
            exit 1
          fi
          if [[ "${OUT}" != *."${ARTIFACT_EXT}" ]]; then
            echo "::error::Expected a .${ARTIFACT_EXT} artifact, got ${OUT}."
            exit 1
          fi
          echo "artifact_path=${OUT}" >> "$GITHUB_OUTPUT"
        env:
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}
          GH_BUILD_ID_E68394: ${{ steps.eas.outputs.build_id }}

      - name: Inspect downloaded Android APK
        id: inspect_apk
        if: env.ARTIFACT_EXT == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          case "${GH_PROFILE_8777ED}" in
            development) EXPECTED_PACKAGE="com.k1w1a0style.musikplayer.dev" ;;
            preview|production) EXPECTED_PACKAGE="com.k1w1a0style.musikplayer" ;;
            *) echo "::error::Unexpected profile '${GH_PROFILE_8777ED}' while validating APK metadata."; exit 1 ;;
          esac
          node scripts/ci/inspectAndroidApk.cjs \
            "${GH_ARTIFACT_PATH_97F6CF}" \
            --expected-package "${EXPECTED_PACKAGE}" \
            --expected-label "k1w1-Musik" \
            --min-size-bytes 10000001 \
            --require-badging \
            --require-signature
        env:
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}
          GH_ARTIFACT_PATH_97F6CF: ${{ steps.download_artifact.outputs.artifact_path }}

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f credentials.json android-upload-keystore.p12 ci-logs/keystore-response.raw.json || true

      - name: Upload Android Artifact
        if: steps.inspect_apk.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k1w1-android-${{ needs.resolve.outputs.profile }}-${{ github.run_number }}-${{ env.ARTIFACT_EXT }}
          path: ${{ steps.download_artifact.outputs.artifact_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release Build Summary"
            echo ""
            echo "- workflow version: \`${WORKFLOW_VERSION}\`"
            echo "- Profile: ${GH_PROFILE_8777ED}"
            echo "- Ref: ${GH_REF_04E218}"
            echo "- Package manager: ${GH_PACKAGE_MANAGER_9162DF}"
            echo "- Lockfile: ${GH_LOCKFILE_PATH_0BD2D6}"
            echo "- Strict lockfile policy: ${GH_STRICT_5F311E}"
            echo "- Dependency install mode: ${GH_MODE_286F08}"
            echo "- Build ID: ${GH_BUILD_ID_E68394}"
            echo ""
            echo "> Hinweis: Dieser Workflow ist ein manueller Direktpfad und umgeht die App-seitige Single Source of Truth."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_PROFILE_8777ED: ${{ needs.resolve.outputs.profile }}
          GH_REF_04E218: ${{ needs.resolve.outputs.ref }}
          GH_PACKAGE_MANAGER_9162DF: ${{ steps.lock.outputs.package_manager }}
          GH_LOCKFILE_PATH_0BD2D6: ${{ steps.lock.outputs.lockfile_path || 'none' }}
          GH_STRICT_5F311E: ${{ steps.strict_lock.outputs.strict }}
          GH_MODE_286F08: ${{ steps.install_deps.outputs.mode }}
          GH_BUILD_ID_E68394: ${{ steps.eas.outputs.build_id }}
