name: Finalize Workflow Contract Tests

on:
  push:
    branches: ["fix/final-prebuild-hardening-2026-08-08"]

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.ref == 'refs/heads/fix/final-prebuild-hardening-2026-08-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/final-prebuild-hardening-2026-08-08
          fetch-depth: 0
          persist-credentials: false

      - name: Align remaining status contract tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/final-prebuild-hardening-2026-08-08
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('__tests__/workflowCiStrategy.test.ts')
          s = p.read_text()

          replacements = [
            (
              "    const successStep = namedStep(easWorkflow, 'Update Build Status - Success');\n    const hasBuildUrlProducerForSuccess = (source: string) => {",
              "    const successStep = namedStep(easWorkflow, 'Update Build Status - Success');\n    const success = parsedNamedStep('eas-build.yml', 'Update Build Status - Success');\n    const hasBuildUrlProducerForSuccess = (source: string) => {",
            ),
            ("    expect(successStep).not.toContain('steps.eas.outputs.build_url');", "    expect(success.run).not.toContain('steps.eas.outputs.build_url');"),
            ("    expect(successStep).not.toContain('steps.eas.outputs.build_id');", "    expect(success.run).not.toContain('steps.eas.outputs.build_id');"),
            ("    expect(successStep).not.toContain('github.event.inputs.job_id');", "    expect(success.run).not.toContain('github.event.inputs.job_id');"),
            ("    expect(successStep).toContain('eas_build_url');", "    expect(success.run).toContain('build_url');"),
            ("    expect(successStep).not.toContain('eas_build_id');", "    expect(success.run).toContain('eas_build_id');"),
            ("    expect(successStep).toContain('curl --fail-with-body');", "    expect(success.run).toContain('curl --fail-with-body');"),
            ("        && successStep.run.includes('eas_build_url')", "        && successStep.run.includes('build_url')"),
            ("    expect(success.run).toContain('eas_build_url');", "    expect(success.run).toContain('build_url');"),
            ("    expect(success.run).not.toContain('eas_build_id');", "    expect(success.run).toContain('eas_build_id');"),
          ]

          changed = False
          for old, new in replacements:
            if old in s:
              s = s.replace(old, new, 1)
              changed = True
            elif new not in s:
              raise SystemExit(f'Expected workflow contract fragment not found: {old}')

          if changed:
            p.write_text(s)
          PY

          if git diff --quiet -- __tests__/workflowCiStrategy.test.ts; then
            echo "Contract tests already aligned; nothing to commit."
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add __tests__/workflowCiStrategy.test.ts
          git commit -m 'test: align status contracts with secure env mapping'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"
