name: Update queue serialization tests

on:
  pull_request:
    branches: [codex]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/update-queue-serialization-tests.yml'
      - 'scripts/ci/updateQueueSerializationTests.cjs'

permissions:
  contents: write

concurrency:
  group: update-queue-serialization-tests
  cancel-in-progress: false

jobs:
  update-tests:
    if: github.head_ref == 'fix/deep-scan-final-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/deep-scan-final-2026-07-25
          fetch-depth: 0

      - name: Apply exact test-only update
        run: |
          node scripts/ci/updateQueueSerializationTests.cjs
          git diff --check
          test "$(git diff --name-only)" = 'contexts/__tests__/playbackQueueActionHelpers.test.ts'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify native mutation lock tests
        run: npm test -- --runInBand utils/__tests__/nativeQueueMutationLock.test.ts

      - name: Verify queue reorder tests
        run: npm test -- --runInBand contexts/__tests__/playbackQueueReorderAction.test.ts

      - name: Run play-song plan serialization diagnostic
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test -- --runInBand contexts/__tests__/playbackQueueActionHelpers.test.ts --testNamePattern "builds its plan from the native ref inside the mutation chain" 2>&1 | tee play-song-plan-test.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > play-song-plan-test.exit-code
          exit 0

      - name: Upload play-song plan diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: play-song-plan-test
          path: |
            play-song-plan-test.log
            play-song-plan-test.exit-code
          if-no-files-found: error
          retention-days: 3

      - name: Enforce play-song plan serialization test
        run: |
          status=$(cat play-song-plan-test.exit-code)
          test "$status" -eq 0

      - name: Verify active play-song transaction test
        run: npm test -- --runInBand contexts/__tests__/playbackQueueActionHelpers.test.ts --testNamePattern "finishes before a newer replacement observes queue state"

      - name: Verify all play-song tests
        run: npm test -- --runInBand contexts/__tests__/playbackQueueActionHelpers.test.ts --testNamePattern runPlaySongQueueAction

      - name: Verify shuffle tests
        run: npm test -- --runInBand contexts/__tests__/playbackQueueActionHelpers.test.ts --testNamePattern runShuffleQueueAction

      - name: Verify remaining playback queue helper tests
        run: npm test -- --runInBand contexts/__tests__/playbackQueueActionHelpers.test.ts

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Commit test update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contexts/__tests__/playbackQueueActionHelpers.test.ts
          git commit -m 'test(queue): assert serial native transaction completion'
          git push origin HEAD:fix/deep-scan-final-2026-07-25
