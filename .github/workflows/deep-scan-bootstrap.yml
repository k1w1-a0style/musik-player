name: Publish hardened EAS workflow

on:
  push:
    branches:
      - fix/deep-scan-2026-07-25
  pull_request:
    branches:
      - codex
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: deep-scan-eas-workflow-handoff-2026-07-25
  cancel-in-progress: false

env:
  FINAL_BASE_SHA: 91058d2e41dec8da910a1fff1d1334e83a767abf
  FINAL_BASE_BRANCH: fix/deep-scan-final-2026-07-25
  TARGET_BRANCH: fix/deep-scan-eas-workflow-2026-07-25
  EXPECTED_B64_SHA256: 5ba38c9352c1a9fb5a59611196aa87d713a4abff2a0af46de6b091f4c2acd4b2
  EXPECTED_GZIP_SHA256: abb3b155a01837a87f3e812acc71e07827c83254bcf885a8d509fdc670669ec3
  EXPECTED_PATCH_SHA256: f81d0566d65fc9e13b13589600da4b1f5a9e9237308519f652668090d1e7b0d0
  TRANSPORT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  publish:
    if: github.event_name == 'push' || github.head_ref == 'fix/deep-scan-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout transport data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify and reconstruct source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRANSPORT_HEAD"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH"; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          cat .github/deep-scan-fix.v2.patch.gz.b64.part-* > /tmp/deep-scan-fix.patch.gz.b64
          echo "$EXPECTED_B64_SHA256  /tmp/deep-scan-fix.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/deep-scan-fix.patch.gz.b64 > /tmp/deep-scan-fix.patch.gz
          echo "$EXPECTED_GZIP_SHA256  /tmp/deep-scan-fix.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/deep-scan-fix.patch.gz > /tmp/deep-scan-fix.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/deep-scan-fix.patch" | sha256sum --check --strict

      - name: Apply only the reusable EAS workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${FINAL_BASE_BRANCH}:refs/remotes/origin/final-base"
          test "$(git rev-parse refs/remotes/origin/final-base)" = "$FINAL_BASE_SHA"
          git checkout --detach "$FINAL_BASE_SHA"
          git clean -fdx
          git apply --check --whitespace=error-all \
            --include='.github/workflows/eas-build.yml' \
            /tmp/deep-scan-fix.patch
          git apply --index --whitespace=error-all \
            --include='.github/workflows/eas-build.yml' \
            /tmp/deep-scan-fix.patch
          test "$(git diff --cached --name-only)" = '.github/workflows/eas-build.yml'
          git diff --cached --check

      - name: Commit and publish one-file workflow branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: harden reusable EAS build workflow"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Published $(git rev-parse HEAD) to ${TARGET_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
