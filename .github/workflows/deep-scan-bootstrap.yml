name: Publish compact EAS workflow scripts

on:
  push:
    branches:
      - fix/deep-scan-2026-07-25
  pull_request:
    branches:
      - codex
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: deep-scan-eas-scripts-handoff-2026-07-25
  cancel-in-progress: false

env:
  FINAL_BASE_SHA: 91058d2e41dec8da910a1fff1d1334e83a767abf
  FINAL_BASE_BRANCH: fix/deep-scan-final-2026-07-25
  TARGET_BRANCH: fix/deep-scan-eas-scripts-2026-07-25
  EXPECTED_B64_SHA256: f676b3e7a0985f9f6b04ff079d93037fdfac49abeee16645bdfe021a96f4eb41
  EXPECTED_TAR_SHA256: c425e5a11d71c04729af89b70e6431cfee666387e484066c96daa4faafc35d39
  EXPECTED_AUTOFIX_SHA256: 8ff2f1a58acbfec5ad58c7f3477dc9ebcf9d30f8dad64865086547ba11c39f9b
  EXPECTED_BUILD_SHA256: 415ad6c9d5f5083cdd84fecabd551a2cb730896bf9b3939e9d3d594b9cc7e96f
  TRANSPORT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  publish:
    if: github.event_name == 'push' || github.head_ref == 'fix/deep-scan-2026-07-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout transport data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify compact script archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRANSPORT_HEAD"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH"; then
            echo "Target branch already exists: $TARGET_BRANCH" >&2
            exit 1
          fi
          cp .github/eas-compact-scripts.tar.gz.b64 /tmp/eas-compact-scripts.tar.gz.b64
          echo "$EXPECTED_B64_SHA256  /tmp/eas-compact-scripts.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/eas-compact-scripts.tar.gz.b64 > /tmp/eas-compact-scripts.tar.gz
          echo "$EXPECTED_TAR_SHA256  /tmp/eas-compact-scripts.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/eas-compact-scripts
          tar -xzf /tmp/eas-compact-scripts.tar.gz -C /tmp/eas-compact-scripts
          echo "$EXPECTED_AUTOFIX_SHA256  /tmp/eas-compact-scripts/scripts/ci/easWorkflowAutofix.sh" | sha256sum --check --strict
          echo "$EXPECTED_BUILD_SHA256  /tmp/eas-compact-scripts/scripts/ci/easWorkflowBuild.sh" | sha256sum --check --strict
          bash -n /tmp/eas-compact-scripts/scripts/ci/easWorkflowAutofix.sh
          bash -n /tmp/eas-compact-scripts/scripts/ci/easWorkflowBuild.sh

      - name: Apply only the two EAS helper scripts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${FINAL_BASE_BRANCH}:refs/remotes/origin/final-base"
          test "$(git rev-parse refs/remotes/origin/final-base)" = "$FINAL_BASE_SHA"
          git checkout --detach "$FINAL_BASE_SHA"
          git clean -fdx
          install -D -m 0755 /tmp/eas-compact-scripts/scripts/ci/easWorkflowAutofix.sh scripts/ci/easWorkflowAutofix.sh
          install -D -m 0755 /tmp/eas-compact-scripts/scripts/ci/easWorkflowBuild.sh scripts/ci/easWorkflowBuild.sh
          echo "$EXPECTED_AUTOFIX_SHA256  scripts/ci/easWorkflowAutofix.sh" | sha256sum --check --strict
          echo "$EXPECTED_BUILD_SHA256  scripts/ci/easWorkflowBuild.sh" | sha256sum --check --strict
          git add scripts/ci/easWorkflowAutofix.sh scripts/ci/easWorkflowBuild.sh
          test "$(git diff --cached --name-only | paste -sd, -)" = 'scripts/ci/easWorkflowAutofix.sh,scripts/ci/easWorkflowBuild.sh'
          git diff --cached --check

      - name: Commit and publish script branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: add reusable EAS workflow helpers"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Published $(git rev-parse HEAD) to ${TARGET_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
