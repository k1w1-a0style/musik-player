name: One-shot xcode uuid lockfile regeneration

on:
  push:
    branches:
      - fix/supply-chain-xcode-uuid-11-1-1-2026-08-05

permissions:
  contents: write

concurrency:
  group: one-shot-xcode-uuid-lockfile
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact regenerated graph without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify xcode and uuid compatibility
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock = require('./package-lock.json');
          const uuid = lock.packages?.['node_modules/uuid'];
          if (uuid?.version !== '11.1.1') {
            throw new Error(`Expected uuid 11.1.1, got ${uuid?.version ?? 'missing'}`);
          }
          const xcode = require('xcode');
          const project = xcode.project('/tmp/nonexistent.pbxproj');
          project.hash = { project: { objects: {} } };
          const generated = project.generateUuid();
          if (!/^[0-9A-F]{24}$/.test(generated)) {
            throw new Error(`Unexpected xcode UUID: ${generated}`);
          }
          NODE
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "package-lock.json" ]; then
            printf 'Unexpected generated changes:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/one-shot-xcode-uuid-lockfile.yml
          git commit -m 'Regenerate lockfile for xcode uuid 11.1.1'
          git push origin HEAD:refs/heads/fix/supply-chain-xcode-uuid-11-1-1-2026-08-05
