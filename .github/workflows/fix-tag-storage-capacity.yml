name: Fix tag storage capacity handling

on:
  pull_request:
    branches: [codex]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/fix-tag-storage-capacity.yml'
      - 'scripts/ci/applyTagStorageCapacityFix.cjs'

permissions:
  contents: write

concurrency:
  group: fix-tag-storage-capacity
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/deep-scan-final-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/deep-scan-final-2026-07-25
          fetch-depth: 0

      - name: Apply exact fail-closed storage capacity patch
        run: |
          node scripts/ci/applyTagStorageCapacityFix.cjs
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = 'modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt,modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/AudioTagTransactionRegressionTest.kt'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Select JDK 17
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Generate Android project for native test
        env:
          EAS_BUILD_PROFILE: production
        run: npx --no-install expo prebuild --platform android --no-install --clean

      - name: Verify focused Kotlin regression test
        working-directory: android
        run: ./gradlew :expo-system-audio:testDebugUnitTest --tests expo.modules.systemaudio.saf.AudioTagTransactionRegressionTest --no-daemon --console=plain

      - name: Commit fail-closed storage capacity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt \
            modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/AudioTagTransactionRegressionTest.kt
          git commit -m 'fix(tags): fail closed when storage capacity is unknown'
          git push origin HEAD:fix/deep-scan-final-2026-07-25
