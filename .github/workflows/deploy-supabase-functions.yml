# Legacy manual bridge for Supabase build_jobs. Prefer .github/workflows/eas-build.yml
# for new EAS builds; keep this workflow only for existing Supabase-triggered jobs.
name: Supabase-Triggered EAS Build (Legacy Manual)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Die Supabase job_id'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize this legacy service-role bridge instead of interpolating untrusted input.
  group: supabase-triggered-eas-build-legacy
  cancel-in-progress: false

jobs:
  run-eas-build:
    if: ${{ vars.ENABLE_CLOUD_EAS_BUILDS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_ID: ${{ github.event.inputs.job_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Job ID
        shell: bash
        run: |
          set -euo pipefail
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [[ ! "${JOB_ID:-}" =~ ${UUID_RE} ]]; then
            echo "::error::job_id must be a canonical UUID."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are required."
            exit 1
          fi
          # A canonical UUID contains only URL-safe characters; keep a separate env name so
          # every PostgREST call uses the validated value rather than raw input.
          JOB_ID_ENCODED="$JOB_ID"
          echo "JOB_ID_ENCODED=${JOB_ID_ENCODED}" >> "$GITHUB_ENV"
          echo "✓ Validated Supabase build job UUID."

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 16.32.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Update Build Status - Building
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -X PATCH "${SUPABASE_URL%/}/rest/v1/build_jobs?id=eq.${JOB_ID_ENCODED}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"building\",\"github_run_id\":\"${{ github.run_id }}\"}"

      - name: Run EAS Build
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          BUILD_OUTPUT=$(eas build --platform android --non-interactive --no-wait 2>&1)
          echo "$BUILD_OUTPUT"
          UUID_RE='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          BUILD_URL="$(echo "$BUILD_OUTPUT" | grep -oE "https://expo.dev[^[:space:]]*/builds/${UUID_RE}" | head -n1 || true)"
          BUILD_ID="$(echo "$BUILD_URL" | grep -oE "${UUID_RE}$" || true)"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="$(echo "$BUILD_OUTPUT" | grep -oE "Build ID:[[:space:]]*${UUID_RE}" | grep -oE "${UUID_RE}" | head -n1 || true)"
          fi
          if [ -z "$BUILD_ID" ]; then
            echo "::error::EAS accepted the build command but no build UUID could be extracted. Refusing to mark the job completed."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Update Build Status - Success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -X PATCH "${SUPABASE_URL%/}/rest/v1/build_jobs?id=eq.${JOB_ID_ENCODED}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"eas_build_id\":\"${{ steps.eas.outputs.build_id }}\"}"

      - name: Update Build Status - Failed
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -X PATCH "${SUPABASE_URL%/}/rest/v1/build_jobs?id=eq.${JOB_ID_ENCODED}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"error\",\"github_run_id\":\"${{ github.run_id }}\"}"
