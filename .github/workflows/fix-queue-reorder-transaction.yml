name: Fix queue reorder transaction

on:
  pull_request:
    branches: [codex]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/fix-queue-reorder-transaction.yml'
      - 'scripts/ci/applyQueueReorderTransactionFix.cjs'

permissions:
  contents: write

concurrency:
  group: fix-queue-reorder-transaction
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'fix/deep-scan-final-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/deep-scan-final-2026-07-25
          fetch-depth: 0

      - name: Apply exact queue transaction patch
        run: |
          node scripts/ci/applyQueueReorderTransactionFix.cjs
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = 'contexts/__tests__/playbackQueueReorderAction.test.ts,contexts/playbackQueueActionHelpers.ts'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused queue tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test -- --runInBand contexts/__tests__/playbackQueueReorderAction.test.ts contexts/__tests__/playbackQueueActionHelpers.test.ts 2>&1 | tee queue-transaction-tests.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > queue-transaction-tests.exit-code
          exit 0

      - name: Upload focused queue test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queue-transaction-tests
          path: |
            queue-transaction-tests.log
            queue-transaction-tests.exit-code
          if-no-files-found: error
          retention-days: 3

      - name: Enforce focused queue tests
        run: |
          status=$(cat queue-transaction-tests.exit-code)
          test "$status" -eq 0

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Commit queue transaction fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contexts/playbackQueueActionHelpers.ts contexts/__tests__/playbackQueueReorderAction.test.ts
          git commit -m 'fix(queue): commit reorder state only after native success'
          git push origin HEAD:fix/deep-scan-final-2026-07-25
