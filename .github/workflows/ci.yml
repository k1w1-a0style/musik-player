name: CI

on:
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-native-streaming-saf-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/v7-1-pr-2b-native-streaming-saf-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: gpt/v7-1-pr-2b-native-streaming-saf-rewrite
      - name: Apply complete streaming SAF migration
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 - <<'PY'
          from pathlib import Path

          phase_one = Path('scripts/ci/patchNativeStreamingSaf.py')
          text = phase_one.read_text()
          marker = '# Fail closed if any production/test source still references the retired full-audio bridge.'
          if marker not in text:
              raise SystemExit('phase-one scan marker missing')
          phase_one.write_text(text[:text.index(marker)])

          phase_two = Path('scripts/ci/patchNativeStreamingSafPhase2.py')
          text = phase_two.read_text()
          start_marker = 'if \'AsyncFunction("verifyAudioTagDeletion")\' not in module:'
          end_marker = 'if "private fun verifyAudioTagDeletion(" not in module:'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('phase-two registration patch markers missing')
          replacement = '''if 'AsyncFunction("verifyAudioTagDeletion")' not in module:
              registration_marker = '    AsyncFunction("getAudioTagRecoveryStatus") {'
              insert_at = module.find(registration_marker)
              if insert_at < 0:
                  raise SystemExit("native recovery registration marker missing")
              registration = """    AsyncFunction("verifyAudioTagDeletion") { uri: String, request: Map<String, Any?> ->
                verifyAudioTagDeletion(uri, request)
              }

          """
              module = module[:insert_at] + registration + module[insert_at:]
          '''
          phase_two.write_text(text[:start] + replacement + text[end:])
          PY
          {
            python3 scripts/ci/patchNativeStreamingSaf.py
            python3 scripts/ci/patchNativeStreamingSafPhase2.py
          } > patch-native-streaming.log 2>&1
          status=$?
          set -e
          cat patch-native-streaming.log
          printf '%s\n' "$status" > patch-native-streaming.exit-code
          if [ "$status" -eq 0 ]; then
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              modules/expo-system-audio/index.ts \
              modules/expo-system-audio/__tests__/index.test.ts \
              modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/SystemAudioModule.kt \
              modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagRewriteSource.kt \
              modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt \
              modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/StreamingMp3TagRewriter.kt \
              modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf \
              utils/tagWriterSaf.ts \
              utils/tagWriterNativeRequest.ts \
              utils/tagWriteVerification.ts \
              utils/__tests__/tagWriter.test.ts \
              utils/__tests__/tagWriterSafRecoveryGate.test.ts \
              utils/__tests__/tagWriteVerification.test.ts \
              __mocks__/expo-system-audio.js
            git commit -m "feat: replace SAF full-file bridge with native streaming rewrites"
            git push origin HEAD:gpt/v7-1-pr-2b-native-streaming-saf-rewrite
          fi
          exit "$status"
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-streaming-patch-log
          path: |
            patch-native-streaming.log
            patch-native-streaming.exit-code
          if-no-files-found: error
          retention-days: 3
