name: CI

on:
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-saf-streaming-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/v7-1-pr-2b-native-streaming-saf-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: gpt/v7-1-pr-2b-native-streaming-saf-rewrite
      - name: Apply parser, size and storage hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/patchSafStreamingHardening.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/SystemAudioModule.kt \
            modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagRewriteSource.kt \
            modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt \
            modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/AudioTagTransactionManagerTest.kt \
            modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/StreamingAudioTagRewriterTest.kt \
            modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/TestAudioTagRewriteSource.kt
          git commit -m "fix: harden native SAF streaming request boundaries"
          git push origin HEAD:gpt/v7-1-pr-2b-native-streaming-saf-rewrite
