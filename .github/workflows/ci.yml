name: CI

on:
  pull_request:
    branches: [main, codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-legacy-saf-test-native-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'cp40ln-codex/implementiere-dauerhafte-saf-transaktionen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
      - name: Add default successful recovery mock
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('utils/__tests__/tagWriter.test.ts')
          text = path.read_text()
          old = '''  const loadWithNative = (native: Record<string, unknown>) => {
              jest.doMock('expo-system-audio', () => ({ __esModule: true, default: native, SystemAudio: native }));
              // eslint-disable-next-line @typescript-eslint/no-require-imports
              return require('../tagWriter') as typeof import('../tagWriter');
            };
          '''
          new = '''  const loadWithNative = (native: Record<string, unknown>) => {
              const nativeWithRecovery = {
                recoverPendingAudioTagTransactions: jest.fn().mockResolvedValue({
                  success: true,
                  recoveryPending: false,
                  pendingCount: 0,
                }),
                ...native,
              };
              jest.doMock('expo-system-audio', () => ({
                __esModule: true,
                default: nativeWithRecovery,
                SystemAudio: nativeWithRecovery,
              }));
              // eslint-disable-next-line @typescript-eslint/no-require-imports
              return require('../tagWriter') as typeof import('../tagWriter');
            };
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one loadWithNative helper, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/__tests__/tagWriter.test.ts
          git commit -m "test: include SAF recovery API in native fixtures"
          git push origin HEAD:cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
