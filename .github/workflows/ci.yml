name: CI

on:
  pull_request:
    branches: [main, codex]
  push:
    branches: [main, codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, tests, coverage, lint, config gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Lint
        run: npm run lint:ci

      - name: Expo config release gate
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo config --json > expo-config.json
          node scripts/ci/checkExpoReleaseConfig.cjs expo-config.json

      - name: Generated Android manifest permission gate
        run: npm run check:android-permissions

      - name: Select JDK 17 for Android Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ]; then
            echo "::error::JAVA_HOME_17_X64 is not available on this runner."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Android Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew :app:compileDebugKotlin --no-daemon
