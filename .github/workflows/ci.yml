name: CI

on:
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-mp4-trailing-atom-streaming:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/v7-1-pr-2b-native-streaming-saf-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: gpt/v7-1-pr-2b-native-streaming-saf-rewrite
      - name: Fix trailing top-level atom streaming
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          writer_path = Path('modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/StreamingMp4TagRewriter.kt')
          writer = writer_path.read_text()
          old = '''          for (atom in top) {
                      if (atom.start != written) {
                        throw AudioTagRewriteException("InvalidTagData", "MP4 top-level atoms are not contiguous.")
                      }
                      if (atom === moov) {
          '''
          new = '''          for (atom in top) {
                      if (atom === moov) {
          '''
          if writer.count(old) != 1:
              raise SystemExit(f'expected one output/input offset comparison, found {writer.count(old)}')
          writer_path.write_text(writer.replace(old, new, 1))

          test_path = Path('modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/StreamingAudioTagRewriterTest.kt')
          test = test_path.read_text()
          marker = '''  @Test
            fun mp4MoovBeforeMdatAllowsSameSizeReplacementAndPreservesMdatOffset() {
          '''
          if marker not in test:
              raise SystemExit('MP4 same-size test marker missing')
          new_test = '''  @Test
            fun mp4SizeChangingMoovAfterMdatPreservesTrailingTopLevelAtoms() {
              val directory = createTempDir(prefix = "streaming-mp4-trailing-atom-")
              val fixture = mp4Fixture(moovBeforeMdat = false, title = null)
              val trailingFree = atom("free", byteArrayOf(9, 8, 7, 6))
              val original = File(directory, "original.m4a").apply { writeBytes(fixture.file + trailingFree) }
              val rewritten = File(directory, "rewritten.m4a")

              val result = StreamingMp4TagRewriter.rewrite(
                original,
                rewritten,
                textSpec("m4a", "title", "A longer streamed title"),
                maxBytes,
              )
              val output = rewritten.readBytes()

              assertTrue(result.changed)
              assertArrayEquals(fixture.mdat, output.copyOfRange(0, fixture.mdat.size))
              assertArrayEquals(trailingFree, output.copyOfRange(output.size - trailingFree.size, output.size))
              assertTrue(indexOf(output, "A longer streamed title".toByteArray(Charsets.UTF_8)) >= 0)
            }

          '''
          test_path.write_text(test.replace(marker, new_test + marker, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/StreamingMp4TagRewriter.kt \
            modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/StreamingAudioTagRewriterTest.kt
          git commit -m "fix: stream trailing MP4 atoms after resized moov"
          git push origin HEAD:gpt/v7-1-pr-2b-native-streaming-saf-rewrite
