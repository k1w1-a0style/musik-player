name: Apply focused planner expectation patch

on:
  pull_request:
    branches: [codex]

permissions:
  contents: write

concurrency:
  group: planner-expectation-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace the one stale expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('utils/__tests__/tagWriteOrchestrator.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "expect(getTagEditCapability(safUriWithoutSource, 'android').canWrite).toBe(true);"
          new = "expect(getTagEditCapability(safUriWithoutSource, 'android').canWrite).toBe(false);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale expectation, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          git diff --exit-code --quiet && {
            echo 'No patch required.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/__tests__/tagWriteOrchestrator.test.ts
          git commit -m 'Block source-less content URI in orchestrator expectation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
