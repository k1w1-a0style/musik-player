name: CI

on:
  pull_request:
    branches: [main, codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-target-scoped-recovery-typescript:
    if: github.event_name == 'pull_request' && github.head_ref == 'cp40ln-codex/implementiere-dauerhafte-saf-transaktionen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
      - name: Patch TypeScript bridge and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          index_path = Path('modules/expo-system-audio/index.ts')
          index = index_path.read_text()
          replacements = [
            (
              '  recoverPendingAudioTagTransactions?(): Promise<RecoveryRunResult>;',
              '  recoverPendingAudioTagTransactions?(uri?: string): Promise<RecoveryRunResult>;',
            ),
            (
              '  async recoverPendingAudioTagTransactions(): Promise<RecoveryRunResult> {',
              '  async recoverPendingAudioTagTransactions(uri?: string): Promise<RecoveryRunResult> {',
            ),
            (
              '      ? native.recoverPendingAudioTagTransactions()',
              '      ? native.recoverPendingAudioTagTransactions(uri)',
            ),
          ]
          for old, new in replacements:
            if index.count(old) != 1:
              raise SystemExit(f'expected one index.ts occurrence: {old!r}; found {index.count(old)}')
            index = index.replace(old, new, 1)
          index_path.write_text(index)

          saf_path = Path('utils/tagWriterSaf.ts')
          saf = saf_path.read_text()
          old = '        recovery = await SystemAudio.recoverPendingAudioTagTransactions();'
          new = '        recovery = await SystemAudio.recoverPendingAudioTagTransactions(uri);'
          if saf.count(old) != 1:
            raise SystemExit(f'expected one SAF recovery call, found {saf.count(old)}')
          saf_path.write_text(saf.replace(old, new, 1))

          wrapper_test_path = Path('modules/expo-system-audio/__tests__/index.test.ts')
          wrapper_test = wrapper_test_path.read_text()
          old = "  await expect(SystemAudio.recoverPendingAudioTagTransactions()).resolves.toMatchObject({ errorCode: 'RecoveryPending', recoveryPending: true });\n"
          new = "  await expect(SystemAudio.recoverPendingAudioTagTransactions('content://song.mp3')).resolves.toMatchObject({ errorCode: 'RecoveryPending', recoveryPending: true });\n  expect(recoverPendingAudioTagTransactions).toHaveBeenCalledWith('content://song.mp3');\n"
          if wrapper_test.count(old) != 1:
            raise SystemExit(f'expected one wrapper recovery assertion, found {wrapper_test.count(old)}')
          wrapper_test_path.write_text(wrapper_test.replace(old, new, 1))

          gate_test_path = Path('utils/__tests__/tagWriterSafRecoveryGate.test.ts')
          gate_test = gate_test_path.read_text()
          old_pending = '    expect(recover).toHaveBeenCalledTimes(1);\n    expect(read).not.toHaveBeenCalled();'
          new_pending = "    expect(recover).toHaveBeenCalledTimes(1);\n    expect(recover).toHaveBeenCalledWith('content://provider/tree/song.mp3');\n    expect(read).not.toHaveBeenCalled();"
          if gate_test.count(old_pending) != 1:
            raise SystemExit(f'expected one pending recovery assertion, found {gate_test.count(old_pending)}')
          gate_test = gate_test.replace(old_pending, new_pending, 1)
          old_success = "    expect(result.status).toBe('written');\n    expect(order).toEqual(['recover', 'read', 'write']);"
          new_success = "    expect(result.status).toBe('written');\n    expect(recover).toHaveBeenCalledWith('content://provider/tree/song.mp3');\n    expect(order).toEqual(['recover', 'read', 'write']);"
          if gate_test.count(old_success) != 1:
            raise SystemExit(f'expected one successful recovery assertion, found {gate_test.count(old_success)}')
          gate_test_path.write_text(gate_test.replace(old_success, new_success, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/expo-system-audio/index.ts modules/expo-system-audio/__tests__/index.test.ts utils/tagWriterSaf.ts utils/__tests__/tagWriterSafRecoveryGate.test.ts
          git commit -m "fix: target pre-read SAF recovery to the active URI"
          git push origin HEAD:cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
