name: CI

on:
  pull_request:
    branches: [main, codex]
  push:
    branches: [main, codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, tests, coverage, lint, config gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --runInBand

      - name: Coverage
        run: npm run test:coverage -- --runInBand

      - name: Lint
        run: npm run lint:ci

      - name: Expo config release gate
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo config --json > expo-config.json
          node scripts/ci/checkExpoReleaseConfig.cjs expo-config.json

      - name: Generated Android manifest permission gate
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo prebuild --platform android --no-install --clean
          node scripts/ci/checkAndroidManifestPermissions.cjs android/app/src/main/AndroidManifest.xml
