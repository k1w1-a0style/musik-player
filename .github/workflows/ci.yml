name: CI

on:
  pull_request:
    branches: [main, codex]
  push:
    branches: [main, codex]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, tests, coverage, lint, config gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture production dependency audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          npm audit --omit=dev --json > ci-logs/npm-audit-production.json
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > ci-logs/npm-audit-production.exit-code
          node -e "JSON.parse(require('fs').readFileSync('ci-logs/npm-audit-production.json', 'utf8'))"
          echo "npm audit exited with $audit_status; policy evaluation uses the complete JSON report."

      - name: Upload production dependency audit
        if: ${{ always() && hashFiles('ci-logs/npm-audit-production.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-production
          path: |
            ci-logs/npm-audit-production.json
            ci-logs/npm-audit-production.exit-code
          if-no-files-found: error
          retention-days: 5

      - name: Enforce production dependency audit policy
        run: |
          node scripts/ci/checkNpmAudit.cjs \
            ci-logs/npm-audit-production.json \
            security/npm-audit-exceptions.json \
            package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run test:coverage -- --runInBand 2>&1 | tee jest-coverage.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > jest-coverage.exit-code
          exit 0

      - name: Upload Jest coverage diagnostic log
        if: ${{ always() && hashFiles('jest-coverage.exit-code') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-coverage-log
          path: |
            jest-coverage.log
            jest-coverage.exit-code
          if-no-files-found: error
          retention-days: 3

      - name: Enforce Jest coverage result
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat jest-coverage.exit-code)
          if [ "$status" -ne 0 ]; then
            echo "::error::Jest coverage failed with exit code $status. See jest-coverage-log artifact."
            exit "$status"
          fi

      - name: Lint
        run: npm run lint:ci

      - name: Code complexity regression gate
        run: npm run check:complexity

      - name: Expo config release gate
        shell: bash
        env:
          EAS_BUILD_PROFILE: production
        run: |
          set -euo pipefail
          npx --no-install expo config --json > expo-config.json
          node scripts/ci/checkExpoReleaseConfig.cjs expo-config.json

      - name: Generated Android manifest permission gate
        env:
          EAS_BUILD_PROFILE: production
        run: npm run check:android-permissions

      - name: Select JDK 17 for Android Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ]; then
            echo "::error::JAVA_HOME_17_X64 is not available on this runner."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Generate Android project for native checks
        shell: bash
        env:
          EAS_BUILD_PROFILE: production
        run: |
          set -euo pipefail
          echo "No APK/AAB/EAS build is performed in this workflow."
          java -version
          npx --no-install expo prebuild --platform android --no-install --clean

      - name: Android native compile and unit tests – no APK/EAS build
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cd android
          echo "Exact native Gradle test task: ./gradlew :app:compileDebugKotlin :expo-system-audio:testDebugUnitTest --no-daemon --console=plain"
          ./gradlew :app:compileDebugKotlin :expo-system-audio:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee ../native-gradle.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > ../native-gradle.exit-code
          exit 0

      - name: Upload native Gradle diagnostic log and JUnit reports
        if: ${{ always() && hashFiles('native-gradle.exit-code') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-gradle-log
          path: |
            native-gradle.log
            native-gradle.exit-code
            modules/expo-system-audio/android/build/test-results/testDebugUnitTest/**/*.xml
            modules/expo-system-audio/android/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 3

      - name: Enforce native Gradle result
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat native-gradle.exit-code)
          if [ "$status" -ne 0 ]; then
            echo "::error::Android native compile or unit tests failed with exit code $status. See native-gradle-log artifact."
            exit "$status"
          fi

      - name: Verify native JUnit execution
        shell: bash
        run: |
          set -euo pipefail
          cd android
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const resultsDir = path.resolve('..', 'modules', 'expo-system-audio', 'android', 'build', 'test-results', 'testDebugUnitTest');
          const files = fs.readdirSync(resultsDir).filter((name) => name.endsWith('.xml'));
          let tests = 0;
          let failures = 0;
          let errors = 0;
          for (const file of files) {
            const xml = fs.readFileSync(path.join(resultsDir, file), 'utf8');
            const match = xml.match(/<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*errors="(\d+)"/);
            if (match) {
              tests += Number(match[1]);
              failures += Number(match[2]);
              errors += Number(match[3]);
            }
          }
          console.log(`Native Gradle test task :expo-system-audio:testDebugUnitTest completed: ${tests} tests, ${failures} failures, ${errors} errors.`);
          if (tests === 0 || failures > 0 || errors > 0) process.exit(1);
          NODE
