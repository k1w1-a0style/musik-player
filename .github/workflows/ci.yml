name: CI

on:
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-bounded-image-base64-helper:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/v7-1-pr-2b-native-streaming-saf-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: gpt/v7-1-pr-2b-native-streaming-saf-rewrite
      - name: Patch palette image decoder only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/SystemAudioModule.kt')
          text = path.read_text()

          if 'import android.util.Base64\n' not in text:
              marker = 'import android.net.Uri\n'
              if marker not in text:
                  raise SystemExit('android Uri import marker missing')
              text = text.replace(marker, marker + 'import android.util.Base64\n', 1)

          old_call = 'decodedBase64ByteLength(base64Payload)'
          if old_call not in text:
              raise SystemExit('palette Base64 length call missing')
          text = text.replace(old_call, 'decodedImageBase64ByteLength(base64Payload)', 1)

          if 'private fun decodedImageBase64ByteLength(' not in text:
              marker = '  private fun String.safeLogUri()'
              index = text.find(marker)
              if index < 0:
                  raise SystemExit('safeLogUri insertion marker missing')
              helper = '''  /** Computes decoded size for bounded image data URIs only; audio bytes never use Base64. */
              private fun decodedImageBase64ByteLength(value: String): Long {
                var cleanLength = 0L
                var last = '\u0000'
                var secondLast = '\u0000'
                value.forEach { char ->
                  if (!char.isWhitespace()) {
                    secondLast = last
                    last = char
                    cleanLength += 1L
                  }
                }
                val padding = when {
                  cleanLength >= 2L && secondLast == '=' && last == '=' -> 2L
                  cleanLength >= 1L && last == '=' -> 1L
                  else -> 0L
                }
                return ((cleanLength * 3L / 4L) - padding).coerceAtLeast(0L)
              }

              '''
              text = text[:index] + helper + text[index:]

          if 'readAudioFileBase64' in text or 'rewrittenAudioBase64' in text:
              raise SystemExit('retired full-audio Base64 bridge reappeared')

          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/SystemAudioModule.kt
          git commit -m "fix: restore bounded palette image Base64 decoding"
          git push origin HEAD:gpt/v7-1-pr-2b-native-streaming-saf-rewrite
