name: CI

on:
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-neutralized-saf-helper:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/v7-1-pr-2b-native-streaming-saf-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: gpt/v7-1-pr-2b-native-streaming-saf-rewrite
      - name: Remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/ci/patchSafStreamingHardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary SAF hardening helper"
          git push origin HEAD:gpt/v7-1-pr-2b-native-streaming-saf-rewrite
