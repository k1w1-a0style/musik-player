name: CI

on:
  pull_request:
    branches: [main, codex]
  push:
    branches: [main, codex, "fix/**", "refactor/**", "review/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup locked npm toolchain
        uses: ./.github/actions/setup-npm

      - name: Capture production dependency audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          set +e
          npm audit --omit=dev --json > ci-logs/npm-audit-production.json
          audit_status=$?
          set -e
          printf '%s\n' "$audit_status" > ci-logs/npm-audit-production.exit-code
          node -e "JSON.parse(require('fs').readFileSync('ci-logs/npm-audit-production.json', 'utf8'))"
          echo "npm audit exited with $audit_status; policy evaluation uses the complete JSON report."

      - name: Upload production dependency audit
        if: ${{ always() && hashFiles('ci-logs/npm-audit-production.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-production
          path: |
            ci-logs/npm-audit-production.json
            ci-logs/npm-audit-production.exit-code
          if-no-files-found: error
          retention-days: 5

      - name: Enforce production dependency audit policy
        run: |
          node scripts/ci/checkNpmAudit.cjs \
            ci-logs/npm-audit-production.json \
            security/npm-audit-exceptions.json \
            package-lock.json


  quality-gates:
    name: Typecheck, tests, coverage, lint, config gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup locked npm toolchain
        uses: ./.github/actions/setup-npm

      - name: Expo dependency compatibility gate
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npm run check:expo-deps

      - name: Source NUL-byte gate
        run: npm run check:source-nul

      - name: Typecheck
        run: npm run typecheck

      - name: Android smoke diagnostic regression tests
        run: python3 -m unittest discover -s scripts/ci -p '*_test.py'

      - name: Tests with coverage
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run test:coverage -- --runInBand 2>&1 | tee jest-coverage.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > jest-coverage.exit-code
          exit 0

      - name: Upload Jest coverage diagnostic log
        if: ${{ always() && hashFiles('jest-coverage.exit-code') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jest-coverage-log
          path: |
            jest-coverage.log
            jest-coverage.exit-code
          if-no-files-found: error
          retention-days: 3

      - name: Enforce Jest coverage result
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat jest-coverage.exit-code)
          if [ "$status" -ne 0 ]; then
            echo "::error::Jest coverage failed with exit code $status. See jest-coverage-log artifact."
            exit "$status"
          fi

      - name: Lint
        run: npm run lint:ci

      - name: Code complexity regression gate
        run: npm run check:complexity

      - name: Production Android bundle dependency boundary
        env:
          EAS_BUILD_PROFILE: production
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx --no-install expo export --platform android --source-maps --output-dir ci-android-export
          node scripts/ci/checkAndroidBundleDependencies.cjs ci-android-export

      - name: Expo config release gate
        shell: bash
        env:
          EAS_BUILD_PROFILE: production
        run: |
          set -euo pipefail
          npx --no-install expo config --json > expo-config.json
          node scripts/ci/checkExpoReleaseConfig.cjs expo-config.json

      - name: Generated Android manifest permission gate
        env:
          EAS_BUILD_PROFILE: production
        run: npm run check:android-permissions


  native-gates:
    name: Android native build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup locked npm toolchain
        uses: ./.github/actions/setup-npm

      - name: Select JDK 17 for Android Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ]; then
            echo "::error::JAVA_HOME_17_X64 is not available on this runner."
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Generate Android project for native checks
        shell: bash
        env:
          EAS_BUILD_PROFILE: production
        run: |
          set -euo pipefail
          echo "Android native build and both module unit-test tasks."
          java -version
          npx --no-install expo prebuild --platform android --no-install --clean

      - name: Android native build and unit tests
        shell: bash
        env:
          PREVIEW_APK_REQUESTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex' && contains(github.event.head_commit.message, '[preview apk]') }}
          EAS_BUILD_PROFILE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex' && contains(github.event.head_commit.message, '[preview apk]') && 'preview' || 'production' }}
        run: |
          set -uo pipefail
          assemble_task=:app:assembleDebug
          if [ "$PREVIEW_APK_REQUESTED" = true ]; then
            assemble_task=:app:assembleRelease
          fi
          set +e
          cd android
          echo "Exact native Gradle test task: ./gradlew $assemble_task :expo-system-audio:testDebugUnitTest :rntp_player:testDebugUnitTest --no-daemon --console=plain"
          ./gradlew "$assemble_task" :expo-system-audio:testDebugUnitTest :rntp_player:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee ../native-gradle.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > ../native-gradle.exit-code
          exit 0

      - name: Upload native Gradle diagnostic log and JUnit reports
        if: ${{ always() && hashFiles('native-gradle.exit-code') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-gradle-log
          path: |
            native-gradle.log
            native-gradle.exit-code
            modules/expo-system-audio/android/build/test-results/testDebugUnitTest/**/*.xml
            modules/expo-system-audio/android/build/reports/tests/testDebugUnitTest/**
            node_modules/@rntp/player/android/build/test-results/testDebugUnitTest/**/*.xml
            node_modules/@rntp/player/android/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 3

      - name: Enforce native Gradle result
        shell: bash
        run: |
          set -euo pipefail
          status=$(cat native-gradle.exit-code)
          if [ "$status" -ne 0 ]; then
            echo "::error::Android native build or unit tests failed with exit code $status. See native-gradle-log artifact."
            exit "$status"
          fi

      - name: Verify native JUnit execution
        shell: bash
        run: |
          set -euo pipefail
          cd android
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const modules = [
            ['expo-system-audio', path.resolve('..', 'modules', 'expo-system-audio', 'android')],
            ['rntp_player', path.resolve('..', 'node_modules', '@rntp', 'player', 'android')],
          ];
          for (const [moduleName, moduleDir] of modules) {
            const resultsDir = path.join(moduleDir, 'build', 'test-results', 'testDebugUnitTest');
            const files = fs.readdirSync(resultsDir).filter((name) => name.endsWith('.xml'));
            let tests = 0;
            let failures = 0;
            let errors = 0;
            for (const file of files) {
              const xml = fs.readFileSync(path.join(resultsDir, file), 'utf8');
              const suite = xml.match(/<testsuite\b[^>]*>/)?.[0] || '';
              const count = (attribute) => Number(suite.match(new RegExp(`${attribute}="(\\d+)"`))?.[1] || 0);
              tests += count('tests');
              failures += count('failures');
              errors += count('errors');
            }
            console.log(`Native Gradle task :${moduleName}:testDebugUnitTest completed: ${tests} tests, ${failures} failures, ${errors} errors.`);
            if (tests === 0 || failures > 0 || errors > 0) process.exit(1);
          }
          NODE

      # Explicit trusted-branch opt-in. Matches the existing credential-free EAS
      # preview signing identity; production signing remains in its own workflow.
      - name: Inspect requested preview APK and signing identity
        id: preview_apk
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex' && contains(github.event.head_commit.message, '[preview apk]') }}
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$tools_dir/apksigner"
          export PATH="$tools_dir:$PATH"
          APK=android/app/build/outputs/apk/release/app-release.apk
          node scripts/ci/inspectAndroidApk.cjs "$APK" \
            --expected-package com.k1w1a0style.musikplayer \
            --expected-label k1w1-Musik \
            --min-size-bytes 10000001 --require-badging --require-signature \
            --enforce-permission-policy | tee preview-apk-inspection.log
          apksigner verify --verbose --print-certs "$APK" > preview-apk-signature.log
          # Certificate from the successful preview APK in run 37595180459.
          node <<'NODE'
          const fs = require('fs');
          const expected = 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c';
          const log = fs.readFileSync('preview-apk-signature.log', 'utf8');
          const certificate = log.match(/^Signer #1 certificate SHA-256 digest: ([a-f0-9]{64})\r?$/im)?.[1]?.toLowerCase();
          if (certificate !== expected) throw new Error('Preview signing certificate does not match the previous preview APK.');
          NODE
          mkdir -p preview-apk
          cp "$APK" preview-apk/musik-player-preview.apk
          printf '%s\n' "$GITHUB_SHA" > preview-apk/source-commit.txt
          sha256sum preview-apk/musik-player-preview.apk > preview-apk/apk-sha256.txt
          cp preview-apk-inspection.log preview-apk-signature.log preview-apk/

      - name: Upload inspected preview APK
        if: ${{ steps.preview_apk.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: musik-player-preview-${{ github.sha }}
          path: preview-apk/
          if-no-files-found: error
          retention-days: 30

  release-ready:
    name: Required release checks
    if: ${{ always() }}
    needs: [security-audit, quality-gates, native-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every independent gate to succeed
        env:
          SECURITY_RESULT: ${{ needs.security-audit.result }}
          QUALITY_RESULT: ${{ needs.quality-gates.result }}
          NATIVE_RESULT: ${{ needs.native-gates.result }}
        run: |
          test "$SECURITY_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$NATIVE_RESULT" = success
