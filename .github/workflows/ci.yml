name: CI

on:
  pull_request:
    branches: [codex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-id3v24-flag-preservation:
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt/v7-1-pr-2b-native-streaming-saf-rewrite'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: gpt/v7-1-pr-2b-native-streaming-saf-rewrite
      - name: Preserve untouched flagged ID3v2.4 frames
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          writer_path = Path('modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/StreamingMp3TagRewriter.kt')
          writer = writer_path.read_text()
          old = '''      val flagA = tag[offset + 8].toInt() and 0xff
                val flagB = tag[offset + 9].toInt() and 0xff
                if (header.major == 4 && (flagA != 0 || flagB != 0)) {
                  throw AudioTagRewriteException(
                    "WriteNotImplemented",
                    "ID3v2.4 frame flags requiring special preservation semantics are not supported yet.",
                  )
                }
          '''
          if writer.count(old) != 1:
              raise SystemExit(f'expected one ID3v2.4 flag block, found {writer.count(old)}')
          writer = writer.replace(old, '', 1)
          writer_path.write_text(writer)

          test_path = Path('modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/StreamingAudioTagRewriterTest.kt')
          test = test_path.read_text()
          marker = '''  @Test
            fun mp3DeletionRemovesOnlyTheRequestedId3Frame() {
          '''
          if marker not in test:
              raise SystemExit('MP3 deletion test marker missing')
          new_test = '''  @Test
            fun mp3RewritePreservesUntouchedFlaggedId3v24FrameExactly() {
              val directory = createTempDir(prefix = "streaming-mp3-v24-flags-")
              val artistBody = byteArrayOf(3, 'A'.code.toByte(), 'r'.code.toByte(), 't'.code.toByte())
              val flaggedArtist = id3v24Frame("TPE1", artistBody, statusFlags = 0x20, formatFlags = 0)
              val audio = byteArrayOf(0xff.toByte(), 0xfb.toByte(), 4, 3, 2, 1)
              val originalBytes = id3v24Tag(flaggedArtist) + audio
              val original = File(directory, "original.mp3").apply { writeBytes(originalBytes) }
              val rewritten = File(directory, "rewritten.mp3")

              val result = StreamingMp3TagRewriter.rewrite(
                original,
                rewritten,
                textSpec("mp3", "title", "New title"),
                maxBytes,
              )
              val output = rewritten.readBytes()
              val audioStart = 10 + decodeSynchsafe(output, 6)

              assertTrue(result.changed)
              assertTrue(indexOf(output, flaggedArtist) >= 0)
              assertArrayEquals(audio, output.copyOfRange(audioStart, output.size))
            }

          '''
          test = test.replace(marker, new_test + marker, 1)

          helper_marker = '''  private fun decodeSynchsafe(bytes: ByteArray, offset: Int): Int =
          '''
          if helper_marker not in test:
              raise SystemExit('synchsafe helper marker missing')
          helpers = '''  private fun id3v24Tag(vararg frames: ByteArray): ByteArray {
              val payload = frames.fold(byteArrayOf()) { accumulated, frame -> accumulated + frame }
              val header = ByteArray(10)
              header[0] = 'I'.code.toByte()
              header[1] = 'D'.code.toByte()
              header[2] = '3'.code.toByte()
              header[3] = 4
              encodeSynchsafe(payload.size).copyInto(header, 6)
              return header + payload
            }

            private fun id3v24Frame(
              id: String,
              body: ByteArray,
              statusFlags: Int,
              formatFlags: Int,
            ): ByteArray {
              val output = ByteArray(10 + body.size)
              id.toByteArray(Charsets.US_ASCII).copyInto(output, 0)
              encodeSynchsafe(body.size).copyInto(output, 4)
              output[8] = statusFlags.toByte()
              output[9] = formatFlags.toByte()
              body.copyInto(output, 10)
              return output
            }

            private fun encodeSynchsafe(value: Int): ByteArray = byteArrayOf(
              ((value ushr 21) and 0x7f).toByte(),
              ((value ushr 14) and 0x7f).toByte(),
              ((value ushr 7) and 0x7f).toByte(),
              (value and 0x7f).toByte(),
            )

          '''
          test = test.replace(helper_marker, helpers + helper_marker, 1)
          test_path.write_text(test)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/StreamingMp3TagRewriter.kt \
            modules/expo-system-audio/android/src/test/java/expo/modules/systemaudio/saf/StreamingAudioTagRewriterTest.kt
          git commit -m "fix: preserve untouched flagged ID3v2.4 frames"
          git push origin HEAD:gpt/v7-1-pr-2b-native-streaming-saf-rewrite
