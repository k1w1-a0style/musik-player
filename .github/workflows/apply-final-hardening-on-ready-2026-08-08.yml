name: Apply Final Hardening On Ready

on:
  pull_request:
    branches: [codex]
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/final-prebuild-hardening-2026-08-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/final-prebuild-hardening-2026-08-08
          fetch-depth: 0
          persist-credentials: false

      - name: Apply verified non-workflow portion
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/final-prebuild-hardening-2026-08-08
          EXPECTED_BASE: 877b812c3dcc764f4b7478742656d781b33ccb03
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/codex:refs/remotes/origin/codex'
          current_base="$(git rev-parse refs/remotes/origin/codex^{commit})"
          if [ "$current_base" != "$EXPECTED_BASE" ]; then
            echo "::error::codex moved from expected base $EXPECTED_BASE to $current_base; refusing stale patch."
            exit 1
          fi

          unexpected="$(git diff --name-only "$EXPECTED_BASE"...HEAD | grep -Ev '^\.github/workflows/apply-final-hardening(-on-ready)?-2026-08-08\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected bootstrap changes before patch: $unexpected"
            exit 1
          fi

          sed -n "/<<'PATCH_B64'/,/^PATCH_B64$/p" \
            .github/workflows/apply-final-hardening-2026-08-08.yml | sed '1d;$d' > /tmp/hardening.patch.gz.b64
          base64 -d /tmp/hardening.patch.gz.b64 | gzip -d > /tmp/hardening.patch
          echo 'e4029a9fd280f3951f3db3837427f4befe0ff2badb6beeba06c008a70ff37caa  /tmp/hardening.patch' | sha256sum -c -
          git apply --check /tmp/hardening.patch
          git apply /tmp/hardening.patch

          # The Actions token cannot update workflow files. Restore them unchanged;
          # the explicitly authorized GitHub connector writes that reviewed portion.
          git restore --source=HEAD -- .github/workflows

          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('package-lock.json','utf8'));"
          grep -Fq '"tar@^7.0.0": "7.5.22"' package.json
          grep -Fq '"version": "7.5.22"' package-lock.json
          git diff --check
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file leaked into Actions-token commit."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden dependencies and diagnostic logging'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"
