name: Reviewed APK player interaction replay

on:
  push:
    branches: [codex]
    paths: [.github/workflows/dev-apk-performance-once.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: manual-android-development-apk
  cancel-in-progress: false

jobs:
  development-apk-smoke:
    if: >-
      github.ref == 'refs/heads/codex' && github.event.head_commit.message == 'ci: verify player interactions against reviewed APK'
    name: Verify reviewed APK with normal player interactions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PACKAGE_NAME: com.k1w1a0style.musikplayer.dev
      AVD_NAME: musik-player-api-35
      ANDROID_API: '35'
      EAS_BUILD_PROFILE: development

    steps:
      - name: Checkout immutable build source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Select JDK 17
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Download and verify the reviewed native APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts ci-logs
          gh run download 34721655108 --repo k1w1-a0style/musik-player --name android-development-apk-1 --dir reviewed-apk
          cp reviewed-apk/artifacts/musik-player-development.apk artifacts/musik-player-development.apk
          echo "99dd63c7f82caeec1167b1ae6efc691715ff1e2ab4832aa4b947d64c1736a5a4  artifacts/musik-player-development.apk" | sha256sum --check
          git diff --exit-code 6da76fd032e7644f4182f5677beed109e12f7a69 HEAD -- modules app.config.js app.json eas.json
          echo 6da76fd032e7644f4182f5677beed109e12f7a69 > ci-logs/apk-source-sha.txt

      - name: Inspect development APK
        shell: bash
        run: |
          set -euo pipefail
          APK=artifacts/musik-player-development.apk
          test -s "$APK"
          node scripts/ci/inspectAndroidApk.cjs "$APK" \
            --expected-package "$PACKAGE_NAME" \
            --expected-label "k1w1-Musik" \
            --min-size-bytes 10000001 \
            --require-badging \
            --require-signature \
            | tee android-development-apk-inspection.log

      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # sdkmanager closes stdin after accepting every license. Ignore the
          # resulting SIGPIPE from `yes`, while still failing if sdkmanager fails.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'emulator' \
            "system-images;android-${ANDROID_API};google_apis;x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-${ANDROID_API};google_apis;x86_64" \
            --device pixel_6

      - name: Boot emulator, install and launch APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > ci-logs/emulator.log 2>&1 &
          echo $! > ci-logs/emulator.pid

          if ! timeout 180 adb wait-for-device; then
            tail -n 160 ci-logs/emulator.log || true
            exit 1
          fi
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          # Software GPU: retain the phone's logical layout at half the pixels.
          # This avoids making cold startup compete with a 1080p CPU renderer.
          adb shell wm size 540x1200
          adb shell wm density 210
          adb shell input keyevent 82 || true
          adb logcat -c

          APK=artifacts/musik-player-development.apk
          adb install -r "$APK" | tee ci-logs/adb-install.log
          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start -W -n "$PACKAGE_NAME/.MainActivity" | tee ci-logs/adb-launch.log
          sleep 8

          pid=$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')
          test -n "$pid"
          echo "appPid=$pid" | tee ci-logs/app-process.log
          adb shell dumpsys activity activities > ci-logs/dumpsys-activities.txt
          grep -F "$PACKAGE_NAME" ci-logs/dumpsys-activities.txt >/dev/null
          adb logcat -d -v threadtime > ci-logs/logcat.txt
          if grep -A20 -B5 -F "Process: ${PACKAGE_NAME}," ci-logs/logcat.txt; then
            echo "::error::The development APK crashed during launch smoke."
            exit 1
          fi

      - name: Exercise real player gestures with Metro and local audio
        # Record launcher boot dialogs and validate the actual antialiased waveform pixels.
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          git rev-parse HEAD | tee ci-logs/reviewed-source-sha.txt
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          env -u EXPO_TOKEN EXPO_NO_TELEMETRY=1 EXPO_OFFLINE=1 EAS_BUILD_PROFILE=development CI=1 \
            npx --no-install expo start --dev-client --localhost --port 8081 > ci-logs/metro.log 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" 2>/dev/null || true' EXIT
          python3 -m venv "$RUNNER_TEMP/player-smoke-venv"
          "$RUNNER_TEMP/player-smoke-venv/bin/python" -m pip install --disable-pip-version-check --no-input -r scripts/ci/android-smoke-requirements.txt
          "$RUNNER_TEMP/player-smoke-venv/bin/python" scripts/ci/androidPlayerInteractionSmoke.py

      - name: Upload APK and smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-development-apk-${{ github.run_number }}
          path: |
            artifacts/musik-player-development.apk
            android-development-build.log
            android-development-apk-inspection.log
            ci-logs/**
          if-no-files-found: warn
          retention-days: 5
