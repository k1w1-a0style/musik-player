name: EAS Link / Init

on:
  workflow_dispatch:
    inputs:
      eas_project_id:
        description: "Optional: existing EAS Project ID (UUID). Leave empty to let EAS try to create/link automatically."
        required: false
        type: string

jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: EAS project:init (link / create)
        env:
          EAS_PROJECT_ID_INPUT: ${{ inputs.eas_project_id }}
        run: |
          set -e
          if [ -n "$EAS_PROJECT_ID_INPUT" ]; then
            echo "Linking with EAS Project ID: $EAS_PROJECT_ID_INPUT"
            npx --yes eas-cli@latest project:init --id "$EAS_PROJECT_ID_INPUT" --non-interactive --force
          else
            echo "No EAS Project ID provided. Trying project:init without --id."
            npx --yes eas-cli@latest project:init --non-interactive --force
          fi

      - name: Commit changes (if any)
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(eas): link/init project"
          git push

