name: EAS Link / Init

on:
  workflow_dispatch:
    inputs:
      eas_project_id:
        description: "Existing EAS Project ID (optional)"
        required: false
        type: string
      expo_owner:
        description: "Expo account/organization (optional)"
        required: false
        type: string

jobs:
  link:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID_INPUT: ${{ github.event.inputs.eas_project_id }}
      EXPO_OWNER_INPUT: ${{ github.event.inputs.expo_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fail if EXPO_TOKEN missing
        run: |
          set -e
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Add GitHub Secret EXPO_TOKEN (or run Secrets Sync in the app)."
            exit 1
          fi

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps
        run: |
          set -e
          npm ci || npm install

      - name: EAS project:init (link / create)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          if [ -n "$EAS_PROJECT_ID_INPUT" ]; then
            echo "Linking with EAS Project ID: $EAS_PROJECT_ID_INPUT"
            npx --yes eas-cli@latest project:init --id "$EAS_PROJECT_ID_INPUT" --non-interactive --force
          else
            echo "No EAS Project ID provided. Trying project:init without --id."
            npx --yes eas-cli@latest project:init --non-interactive --force
          fi

      - name: Commit changes (if any)
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(eas): link/init project"
            git push
          else
            echo "Commit changes (if any): skipped"
          fi
