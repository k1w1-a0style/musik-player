name: One-shot undici lockfile regeneration

on:
  push:
    branches:
      - fix/supply-chain-undici-6-28-0-2026-08-05

permissions:
  contents: write

concurrency:
  group: one-shot-undici-lockfile
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify minimal deterministic result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock = require('./package-lock.json');
          const entry = lock.packages?.['node_modules/undici'];
          if (entry?.version !== '6.28.0') {
            throw new Error(`Expected undici 6.28.0, got ${entry?.version ?? 'missing'}`);
          }
          if (entry.resolved !== 'https://registry.npmjs.org/undici/-/undici-6.28.0.tgz') {
            throw new Error(`Unexpected undici resolved URL: ${entry.resolved}`);
          }
          NODE
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "package-lock.json" ]; then
            printf 'Unexpected generated changes:\n'
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/one-shot-undici-lockfile.yml
          git commit -m 'Regenerate lockfile for undici 6.28.0'
          git push origin HEAD:refs/heads/fix/supply-chain-undici-6-28-0-2026-08-05
