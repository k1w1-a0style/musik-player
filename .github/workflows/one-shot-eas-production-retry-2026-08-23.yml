# One-shot retry after android-keystore-export auth contract fix; removed after queueing.
name: One-shot EAS production retry 2026-08-23

on:
  push:
    branches:
      - codex
    paths:
      - ".github/workflows/one-shot-eas-production-retry-2026-08-23.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-eas-production-retry-2026-08-23
  cancel-in-progress: false

jobs:
  production-aab:
    name: Build production AAB
    permissions:
      contents: write
    uses: ./.github/workflows/eas-build.yml
    with:
      ref: 4b38fd3a5a5c26936a3b68891a9c91504a9292d1
      profile: production
      job_id: ""
      platform: android
      autofix: false
      strict_lockfile: "true"
    secrets: inherit
