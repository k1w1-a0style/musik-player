name: Retest inspected release APK

on:
  push:
    branches: [codex, 'qa/v5-acceptance/**']

permissions:
  contents: read
  actions: read

concurrency:
  group: inspected-preview-ui-retest-${{ (contains(github.event.head_commit.message, '[retest apk]') || contains(github.event.head_commit.message, '[probe apk]')) && 'requested' || github.sha }}
  cancel-in-progress: true

jobs:
  retest-inspected-apk:
    name: Retest same inspected APK with corrected public UI harness
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/codex' || startsWith(github.ref, 'refs/heads/qa/v5-acceptance/')) && (contains(github.event.head_commit.message, '[retest apk]') || contains(github.event.head_commit.message, '[probe apk]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PREVIOUS_MATRIX_EVIDENCE: ${{ contains(github.event.head_commit.message, '[probe matrix remaining]') && 'previous-matrix' || '' }}
      PACKAGE_NAME: com.k1w1a0style.musikplayer
      AVD_NAME: musik-preview-api-35
      ANDROID_API: '35'
      APK_DIAGNOSTIC_MODE: ${{ contains(github.event.head_commit.message, '[probe matrix]') && 'v5-matrix' || contains(github.event.head_commit.message, '[probe cleaner]') && 'v5-cleaner-matrix' || contains(github.event.head_commit.message, '[probe final]') && 'v5-final-stages' || contains(github.event.head_commit.message, '[probe settings]') && 'settings-switch-probe' || contains(github.event.head_commit.message, '[probe swipe]') && 'cover-swipe-probe' || contains(github.event.head_commit.message, '[probe apk]') && 'queue-replacement-probe' || '' }}
      REVIEWED_APK_SOURCE_COMMIT: c47b27f6fee2fd826cb3ea023ce4b1aafdb59b06
      EXPECTED_APK_SHA256: 91ba080aa732bd2e0af1bf437c53bc90ca6179d9d814fd26c596cec3ef0e18fc
    steps:
      - name: Checkout immutable acceptance harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the acceptance harness regressions before device work
        run: |
          python3 - <<'RED'
          import os,subprocess,tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as directory:
              root=Path(directory)
              old=subprocess.check_output(['git','show','30d5b9e1e7df11cb86e30545b3789a8fd29fc995:scripts/ci/androidReleaseInteractionSmoke.py'])
              (root/'androidReleaseInteractionSmoke.py').write_bytes(old)
              (root/'androidReleaseInteractionSmoke_test.py').write_bytes(Path('scripts/ci/androidReleaseInteractionSmoke_test.py').read_bytes())
              env=dict(os.environ,PYTHONPATH=str(root)+os.pathsep+str(Path('scripts/ci').resolve()))
              result=subprocess.run(['python3','-m','unittest','androidReleaseInteractionSmoke_test.ReleaseAcceptanceSafetyTest.test_format_selection_requires_three_terminal_scan_frames_before_coordinate_tap'],cwd=root,env=env,text=True,capture_output=True)
              print(result.stdout+result.stderr,flush=True)
              assert result.returncode!=0 and 'Playback tapped before the native terminal scan ACK' in result.stderr,'Recorded import-coordinate race not reproduced against old harness'
              print('RED reproduced old coordinate tap before terminal scan ACK.',flush=True)
          RED
          python3 -m unittest discover -s scripts/ci -p '*_test.py'

      - name: Download existing inspected APK without rebuilding it
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: musik-player-preview-c47b27f6fee2fd826cb3ea023ce4b1aafdb59b06
          run-id: 38766310237
          github-token: ${{ github.token }}
          path: preview-input

      - name: Reject changed app sources, failed original gates or altered APK bytes
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/ci').resolve()))
          from androidReleaseInteractionSmoke import validate_retest_provenance
          source = os.environ['REVIEWED_APK_SOURCE_COMMIT']
          changed = subprocess.check_output(['git', 'diff', '--name-only', source, os.environ['GITHUB_SHA']], text=True).splitlines()
          request = urllib.request.Request(
              'https://api.github.com/repos/k1w1-a0style/musik-player/actions/runs/38766310237/jobs?per_page=100',
              headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              jobs = json.load(response)['jobs']
          validate_retest_provenance(source, changed, jobs)
          root = Path('preview-input')
          assert (root / 'source-commit.txt').read_text().strip() == source
          expected = os.environ['EXPECTED_APK_SHA256']
          assert (root / 'apk-sha256.txt').read_text().split()[0] == expected
          assert hashlib.sha256((root / 'musik-player-preview.apk').read_bytes()).hexdigest() == expected
          print('Original three source gates passed, app sources unchanged, exact inspected APK bytes confirmed.')
          PYCODE

      - name: Download completed native matrix cases without repeating them
        if: env.PREVIOUS_MATRIX_EVIDENCE != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: retest-preview-release-acceptance-e65cf4ce3d87a7ad310facf43a27c7d076782557
          run-id: 38505950487
          github-token: ${{ github.token }}
          path: previous-matrix
      - name: Bind previous native cases to exact source, successful provenance gate and immutable artifact
        if: env.PREVIOUS_MATRIX_EVIDENCE != ''
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/ci').resolve()))
          from androidReleaseInteractionSmoke import validate_previous_matrix
          def api(path):
              request=urllib.request.Request('https://api.github.com/repos/k1w1-a0style/musik-player/'+path,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as r:return json.load(r)
          run=api('actions/runs/38505950487')
          assert run['head_sha']=='e65cf4ce3d87a7ad310facf43a27c7d076782557' and run['status']=='completed'
          jobs=api('actions/runs/38505950487/jobs')['jobs']
          assert len(jobs)==1
          guards=[s for s in jobs[0]['steps'] if s['name']=='Reject changed app sources, failed original gates or altered APK bytes']
          assert len(guards)==1 and guards[0]['conclusion']=='success'
          artifact=api('actions/artifacts/11868471006')
          assert artifact['digest']=='sha256:749abd2df08334fde929a62f13ce04c075565a6955d03d5cc2291ce88814cbe1'
          paths=list(Path('previous-matrix').rglob('matrix-progress.json'));assert len(paths)==1
          data={'sourceCommit':os.environ['REVIEWED_APK_SOURCE_COMMIT'],'apkSha256':os.environ['EXPECTED_APK_SHA256'],'harnessCommit':run['head_sha'],'run':run['id'],'artifactDigest':artifact['digest'],'cases':json.loads(paths[0].read_text())}
          validate_previous_matrix(data)
          (Path('previous-matrix')/'verified-matrix-origin.json').write_text(json.dumps(data,indent=2))
          print('26 complete native cases bound to the same unchanged inspected APK; all 36 remain required at final validation.')
          PY

      - name: Prepare isolated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/preview-avd"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdk_status" -eq 0
          # The SDK downloader returned a non-ZIP before any app launch.
          # Download the official stable emulator archive independently, require
          # its declared size/checksum and every ZIP CRC before installation.
          python3 - <<'SDK'
          import hashlib,json,os,stat,urllib.request,zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base='https://dl.google.com/android/repository/'
          request=urllib.request.Request(base+'repository2-3.xml',headers={'Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=60) as response:
              metadata=ET.fromstring(response.read())
          local=lambda tag:tag.rsplit('}',1)[-1]
          child=lambda node,name:next(x for x in node if local(x.tag)==name)
          packages=[p for p in metadata.iter() if local(p.tag)=='remotePackage' and p.get('path')=='emulator' and child(p,'channelRef').get('ref')=='channel-0']
          assert len(packages)==1,'Missing/ambiguous official stable emulator metadata'
          archives=[a for a in child(packages[0],'archives') if child(a,'host-os').text=='linux']
          assert len(archives)==1,'Missing/ambiguous Linux archive'
          archive=child(archives[0],'complete');size=int(child(archive,'size').text)
          checksum=child(archive,'checksum');algorithm=checksum.get('type','sha1').lower().replace('-','')
          assert algorithm in ('sha1','sha256')
          expected=checksum.text.strip().lower();url=base+child(archive,'url').text
          print('EMULATOR_DECLARED_ARCHIVE '+json.dumps({'url':url,'size':size,'algorithm':algorithm,'checksum':expected}),flush=True)
          target=Path(os.environ['RUNNER_TEMP'])/'verified-emulator.zip'
          for attempt in (1,2):
              digest=hashlib.new(algorithm);actual=0
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=120) as response,target.open('wb') as output:
                  print('EMULATOR_DOWNLOAD_HEADERS '+json.dumps({'attempt':attempt,'type':response.headers.get('Content-Type'),'length':response.headers.get('Content-Length')}),flush=True)
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk:break
                      actual+=len(chunk);assert actual<=size,'Archive exceeds declared size'
                      digest.update(chunk);output.write(chunk)
              with target.open('rb') as prefix:magic=prefix.read(16).hex()
              print('EMULATOR_DOWNLOAD_RESULT '+json.dumps({'attempt':attempt,'bytes':actual,'digest':digest.hexdigest(),'magic':magic}),flush=True)
              if actual==size and digest.hexdigest()==expected:
                  with zipfile.ZipFile(target) as bundle:assert bundle.testzip() is None,'ZIP CRC mismatch'
                  break
              if attempt==2:raise AssertionError('Official emulator archive size/checksum mismatch after two bounded downloads')
          root=Path(os.environ['ANDROID_HOME']).resolve()
          with zipfile.ZipFile(target) as bundle:
              for item in bundle.infolist():
                  path=(root/item.filename).resolve()
                  assert path.is_relative_to(root),'Unsafe ZIP path'
                  assert not stat.S_ISLNK(item.external_attr>>16),'Unexpected archive symlink'
                  bundle.extract(item,root)
                  mode=(item.external_attr>>16)&0o777
                  if mode and not item.is_dir():path.chmod(mode)
          print('Official emulator archive verified and installed.',flush=True)
          SDK
          test -x "$ANDROID_HOME/emulator/emulator"
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | tee "$RUNNER_TEMP/emulator-linked-libraries.txt"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | tee "$RUNNER_TEMP/emulator-verified-libraries.txt"
          if rg "not found" "$RUNNER_TEMP/emulator-verified-libraries.txt"; then
            echo "::error::Unresolved native emulator runtime dependency."
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -version
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-${ANDROID_API};google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name "$AVD_NAME" --package "system-images;android-${ANDROID_API};google_apis;x86_64" --device pixel_6
          mkdir -p ci-logs
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim \
            -gpu swiftshader -no-metrics -camera-back none -camera-front none > ci-logs/emulator.log 2>&1 &
          echo $! > ci-logs/emulator.pid
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell wm size 480x960
          adb shell wm density 240
          adb shell input keyevent 82
          adb logcat -c

      - name: Prepare public UI test tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          python3 -m venv "$RUNNER_TEMP/release-ui-venv"
          "$RUNNER_TEMP/release-ui-venv/bin/python" -m pip install --disable-pip-version-check --no-input -r scripts/ci/android-smoke-requirements.txt

      - name: Verify twelve affected font2 variants on the new APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIAGNOSTIC_MODE=v5-section-font2 "$RUNNER_TEMP/release-ui-venv/bin/python" scripts/ci/androidReleaseInteractionSmoke.py 2>&1 | tee ci-logs/font2-regression.log
          # Preserve the twelve-case evidence, then reset only this isolated
          # emulator app so full acceptance starts with a fresh collection.
          python3 - <<'TARGET'
          import hashlib,json,os
          from pathlib import Path
          p=Path('ci-logs/font2-regression/stage-result.json')
          result=json.loads(p.read_text())
          assert result['status']=='stage-only-passed' and result['mode']=='v5-section-font2'
          assert result['sourceCommit']==os.environ['REVIEWED_APK_SOURCE_COMMIT']
          assert result['harnessCommit']==os.environ['GITHUB_SHA']
          assert result['apkSha256']==hashlib.sha256(Path('preview-input/musik-player-preview.apk').read_bytes()).hexdigest()
          assert len(result['v5Proofs']['matrix'])==12 and result['releaseAccepted'] is False
          print('Twelve corrected-APK font2 cases passed; starting separate full acceptance of the same bytes.')
          TARGET

      - name: Exercise full release UI, files, playback, backup and restart
        shell: bash
        run: |
          set -euo pipefail
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          adb shell pm clear "$PACKAGE_NAME" | grep -x Success
          adb shell settings put system font_scale 1.0
          adb logcat -c
          "$RUNNER_TEMP/release-ui-venv/bin/python" scripts/ci/androidReleaseInteractionSmoke.py 2>&1 | tee ci-logs/release-ui.log

      - name: Capture diagnostics after any device failure
        if: always()
        run: python3 scripts/ci/androidSmokeDiagnostics.py ci-logs/final "$PACKAGE_NAME"

      - name: Emit bounded public diagnostic observations
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, json
          root = Path('ci-logs/release-interaction')
          names = ('latest-ui.xml','final.xml','result.json','diagnostic-result.json','stage-result.json','stage-progress.json','matrix-progress.json','resume-clock-proof.json','cold-start-uncovered-header.xml','picker-root-before-input.xml','picker-root-input.json','picker-internal-root-ack.xml','playlist-add-proofs.json','fixture-mediastore.txt','cover-swipe-before.xml','cover-swipe-before-session.txt','cover-swipe-input.json','public-input-before.xml','public-input-unfocused.xml','instant-colors-before.xml','instant-colors-after.xml','instant-colors-cold.xml')
          for name in names:
              path = root / name
              if path.is_file() and path.stat().st_size <= 300000:
                  encoded = base64.b64encode(path.read_bytes()).decode()
                  chunks = [encoded[i:i+6000] for i in range(0,len(encoded),6000)]
                  for index, chunk in enumerate(chunks):
                      print('V5_DIAG_CHUNK ' + json.dumps({'name':name,'index':index,'count':len(chunks),'base64':chunk}), flush=True)
          path = root / 'final.png'
          if path.is_file() and path.stat().st_size <= 500000:
              encoded = base64.b64encode(path.read_bytes()).decode()
              chunks = [encoded[i:i+6000] for i in range(0,len(encoded),6000)]
              for index, chunk in enumerate(chunks):
                  print('V5_DIAG_CHUNK ' + json.dumps({'name':'final.png','index':index,'count':len(chunks),'base64':chunk}), flush=True)
          PYCODE

      - name: Upload release acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retest-preview-release-acceptance-${{ github.sha }}
          path: ci-logs/**
          if-no-files-found: error
          retention-days: 30

