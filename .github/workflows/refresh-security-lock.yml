name: Refresh security lockfile

on:
  push:
    branches:
      - fix/deep-scan-final-2026-07-25
    paths:
      - package.json
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-security-lock-fix-deep-scan
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/deep-scan-final-2026-07-25
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate and validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const postcss = packages['node_modules/postcss']?.version;
          if (postcss !== '8.5.23') throw new Error(`Expected postcss 8.5.23, got ${postcss}`);
          const braceVersions = [...new Set(Object.entries(packages)
            .filter(([node]) => node === 'node_modules/brace-expansion' || node.endsWith('/node_modules/brace-expansion'))
            .map(([, value]) => value?.version)
            .filter(Boolean))].sort();
          const allowed = new Set(['1.1.16', '2.1.2', '5.0.8']);
          const unexpected = braceVersions.filter(version => !allowed.has(version));
          if (unexpected.length > 0) throw new Error(`Unexpected brace-expansion versions: ${unexpected.join(', ')}`);
          if (!braceVersions.includes('5.0.8')) throw new Error(`Patched brace-expansion 5.0.8 is missing: ${braceVersions.join(', ')}`);
          console.log({ postcss, braceVersions });
          NODE
          mkdir -p ci-logs
          npm audit --omit=dev --json > ci-logs/npm-audit-production.json || true
          node scripts/ci/checkNpmAudit.cjs \
            ci-logs/npm-audit-production.json \
            security/npm-audit-exceptions.json \
            package-lock.json
          git diff --check
          test -z "$(git diff --name-only -- package.json)"

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): regenerate dependency lockfile"
          git push origin HEAD:fix/deep-scan-final-2026-07-25
