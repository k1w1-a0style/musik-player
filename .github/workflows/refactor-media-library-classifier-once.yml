name: One-time SAF classifier complexity refactor

on:
  push:
    branches:
      - refactor/complexity-media-library-error-classifier-2026-08-06
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-saf-classifier-refactor
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/complexity-media-library-error-classifier-2026-08-06
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact classifier and baseline refactor
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const sourcePath = 'utils/mediaLibraryImport.ts';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const oldBlock = `const classifySafNativeReadErrorMessage = (error: unknown): 'not-directory' | 'permission' | 'unknown' => {
            const message = String((error as { message?: unknown })?.message ?? error).toLowerCase();
            if (message.includes('enotdir') || message.includes('not a directory') || message.includes('is not a directory') || message.includes('not directory') || message.includes('not a folder')) return 'not-directory';
            if (message.includes('timed out') || message.includes('timeout') || message.includes('securityexception') || message.includes('permission') || message.includes('denied') || message.includes('access') || message.includes("isn't readable") || message.includes('is not readable') || message.includes('not readable') || message.includes('cannot read') || message.includes("can't read") || message.includes('could not read') || message.includes('failed to read') || message.includes('read failed') || message.includes('unreadable') || message.includes('unauthorized') || message.includes('eacces') || message.includes('eperm') || message.includes('revoked') || message.includes('provider error') || message.includes('provider failed')) return 'permission';
            return 'unknown';
          };`;
          const newBlock = `const SAF_NOT_DIRECTORY_ERROR_MARKERS = [
            'enotdir',
            'not a directory',
            'is not a directory',
            'not directory',
            'not a folder',
          ] as const;

          const SAF_PERMISSION_ERROR_MARKERS = [
            'timed out',
            'timeout',
            'securityexception',
            'permission',
            'denied',
            'access',
            "isn't readable",
            'is not readable',
            'not readable',
            'cannot read',
            "can't read",
            'could not read',
            'failed to read',
            'read failed',
            'unreadable',
            'unauthorized',
            'eacces',
            'eperm',
            'revoked',
            'provider error',
            'provider failed',
          ] as const;

          const includesAnyMarker = (message: string, markers: readonly string[]): boolean =>
            markers.some(marker => message.includes(marker));

          const classifySafNativeReadErrorMessage = (error: unknown): 'not-directory' | 'permission' | 'unknown' => {
            const message = String((error as { message?: unknown })?.message ?? error).toLowerCase();
            if (includesAnyMarker(message, SAF_NOT_DIRECTORY_ERROR_MARKERS)) return 'not-directory';
            if (includesAnyMarker(message, SAF_PERMISSION_ERROR_MARKERS)) return 'permission';
            return 'unknown';
          };`;

          if (!source.includes(oldBlock)) {
            throw new Error('Expected SAF classifier block was not found; refusing a broad or partial rewrite.');
          }
          const updatedSource = source.replace(oldBlock, newBlock);
          if (updatedSource === source || updatedSource.includes(oldBlock)) {
            throw new Error('SAF classifier replacement did not converge exactly once.');
          }
          fs.writeFileSync(sourcePath, updatedSource);

          const baselinePath = 'security/code-complexity-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const exceptionKey = 'utils/mediaLibraryImport.ts::classifySafNativeReadErrorMessage#1';
          if (!Object.prototype.hasOwnProperty.call(baseline.exceptions, exceptionKey)) {
            throw new Error(`Expected complexity exception is missing: ${exceptionKey}`);
          }
          delete baseline.exceptions[exceptionKey];
          fs.writeFileSync(baselinePath, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE

      - name: Focused media import tests
        run: >-
          npx jest --runInBand
          utils/__tests__/mediaLibraryImport.errorClassification.test.ts
          utils/__tests__/mediaLibraryImport.test.ts

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Lint
        run: npm run lint:ci

      - name: Complexity gate
        run: npm run check:complexity

      - name: Commit verified refactor and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refactor-media-library-classifier-once.yml
          git add utils/mediaLibraryImport.ts security/code-complexity-baseline.json
          printf '%s\n' 'Staged files:'
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'
          git commit -m 'refactor: reduce SAF native error classifier complexity'
          git push origin HEAD:refactor/complexity-media-library-error-classifier-2026-08-06
