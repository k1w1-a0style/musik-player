name: Stop obsolete acceptance diagnostics
on:
  push:
    branches: ['qa/v5-control/**']
permissions:
  contents: read
concurrency:
  group: inspected-preview-ui-retest-requested
  cancel-in-progress: true
jobs:
  stop-obsolete-output:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record diagnostic control only
        run: |
          echo 'Diagnostic control only: supersedes hung output after a failed UI run.'
          echo 'This is not an APK acceptance and has no releaseAccepted result.'
