name: PR 308 journal state patch

on:
  push:
    branches:
      - cp40ln-codex/implementiere-dauerhafte-saf-transaktionen

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
          fetch-depth: 0

      - name: Assign journal states only after durable persistence
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''      journal = journal.withState(TransactionState.WRITE_STARTED)\n      storage.atomicWriteJournal(directory, journal)\n      phase = WriteExecutionPhase.WRITE_INTENT_DURABLE\n''':
              '''      val writeStartedJournal = journal.withState(TransactionState.WRITE_STARTED)\n      storage.atomicWriteJournal(directory, writeStartedJournal)\n      journal = writeStartedJournal\n      phase = WriteExecutionPhase.WRITE_INTENT_DURABLE\n''',
              '''        journal = journal.withState(TransactionState.WRITTEN_UNVERIFIED)\n        storage.atomicWriteJournal(directory, journal)\n''':
              '''        val writtenUnverifiedJournal = journal.withState(TransactionState.WRITTEN_UNVERIFIED)\n        storage.atomicWriteJournal(directory, writtenUnverifiedJournal)\n        journal = writtenUnverifiedJournal\n''',
              '''        journal = journal.withState(TransactionState.COMMITTED)\n        storage.atomicWriteJournal(directory, journal)\n        phase = WriteExecutionPhase.COMMITTED_DURABLE\n''':
              '''        val committedJournal = journal.withState(TransactionState.COMMITTED)\n        storage.atomicWriteJournal(directory, committedJournal)\n        journal = committedJournal\n        phase = WriteExecutionPhase.COMMITTED_DURABLE\n''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match, found {text.count(old)} for:\n{old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr308-journal-state-patch.yml
          git add modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt
          git diff --cached --check
          git commit -m "Persist SAF journal states before publishing them in memory"
          git push origin HEAD:cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
