name: One-shot signed production APK and emulator smoke

on:
  push:
    branches: [codex]
    paths:
      - ".github/workflows/one-shot-production-apk-smoke-2026-08-24.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/eas-build.yml
    with:
      ref: 513574b5a85c8b5eea8e3953220ea98635389fbc
      profile: production
      platform: android
      autofix: false
      strict_lockfile: "true"
    secrets: inherit

  emulator-smoke:
    needs: build
    name: Install and launch signed production APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PACKAGE_NAME: com.k1w1a0style.musikplayer
      AVD_NAME: musik-player-api-35
      ANDROID_API: "35"

    steps:
      - name: Download validated production APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eas-android-production-*-apk
          path: artifacts

      - name: Locate production APK
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find artifacts -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one production APK, found ${#apks[@]}."
            find artifacts -maxdepth 3 -type f -printf '%p %s bytes\n' || true
            exit 1
          fi
          test -s "${apks[0]}"
          echo "apk_path=${apks[0]}" >> "$GITHUB_OUTPUT"
          sha256sum "${apks[0]}"

      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          export ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME" smoke
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             'platform-tools'             'emulator'             "system-images;android-${ANDROID_API};google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd             --force             --name "$AVD_NAME"             --package "system-images;android-${ANDROID_API};google_apis;x86_64"             --device pixel_6

      - name: Boot emulator, install and launch APK
        shell: bash
        env:
          GH_APK_PATH: ${{ steps.locate.outputs.apk_path }}
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator"             -avd "$AVD_NAME"             -no-window             -no-audio             -no-boot-anim             -no-snapshot-save             -gpu swiftshader_indirect             -camera-back none             -camera-front none             > smoke/emulator.log 2>&1 &
          echo $! > smoke/emulator.pid

          if ! timeout 180 adb wait-for-device; then
            tail -n 160 smoke/emulator.log || true
            exit 1
          fi
          timeout 420 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb logcat -c

          adb install -r "$GH_APK_PATH" | tee smoke/adb-install.log
          adb shell am force-stop "$PACKAGE_NAME"
          adb shell am start -W -n "$PACKAGE_NAME/.MainActivity" | tee smoke/adb-launch.log
          sleep 12

          pid="$(adb shell pidof "$PACKAGE_NAME" | tr -d '\r')"
          test -n "$pid"
          echo "appPid=$pid" | tee smoke/app-process.log
          adb shell dumpsys activity activities > smoke/dumpsys-activities.txt
          grep -F "$PACKAGE_NAME" smoke/dumpsys-activities.txt >/dev/null
          adb shell screencap -p > smoke/app-launch.png
          adb logcat -d -v threadtime > smoke/logcat.txt
          if grep -A20 -B5 -F "Process: ${PACKAGE_NAME}," smoke/logcat.txt; then
            echo "::error::The production APK crashed during launch smoke."
            exit 1
          fi

      - name: Upload emulator smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-apk-emulator-smoke-${{ github.run_number }}
          path: smoke/**
          if-no-files-found: warn
          retention-days: 30
