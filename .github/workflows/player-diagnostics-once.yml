name: Inspect player drag failure
on:
  push:
    branches: [codex]
    paths: [.github/workflows/player-diagnostics-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex' && github.event.head_commit.message == 'ci: inspect player drag failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read isolated emulator diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 34787860519 --repo k1w1-a0style/musik-player --name android-development-apk-7 --dir reviewed
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('reviewed/ci-logs')
          for node in ET.parse(root / 'interaction/latest-ui.xml').iter('node'):
              a = node.attrib
              if any(word in str(a) for word in ['queue-', 'Smoke ', 'Warteschlange', 'Als Nächstes']):
                  print('UI_NODE', a)
          print('METRO_DIAGNOSTICS')
          print((root / 'metro.log').read_text()[-14000:])
          print('SCREENSHOT_BASE64=' + base64.b64encode((root / 'interaction/final.png').read_bytes()).decode())
          PY
