name: One-time storage validator prototype-key hardening

on:
  push:
    branches:
      - refactor/complexity-storage-validator-map-2026-08-06
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-storage-validator-prototype-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/complexity-storage-validator-map-2026-08-06
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact own-property dispatch guard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'utils/storage.ts';
          const source = fs.readFileSync(path, 'utf8');
          const oldBlock = `const validateStoredValue = (key: string, value: unknown): unknown | null => {
            const validator = STORAGE_VALUE_VALIDATORS[key as StorageKey];
            return validator === undefined ? value : validator(value);
          };`;
          const newBlock = `const validateStoredValue = (key: string, value: unknown): unknown | null => {
            const validator = Object.prototype.hasOwnProperty.call(STORAGE_VALUE_VALIDATORS, key)
              ? STORAGE_VALUE_VALIDATORS[key as StorageKey]
              : undefined;
            return validator === undefined ? value : validator(value);
          };`;
          if (!source.includes(oldBlock)) {
            throw new Error('Expected validator dispatch block was not found.');
          }
          const updated = source.replace(oldBlock, newBlock);
          if (updated === source || updated.includes(oldBlock)) {
            throw new Error('Prototype-key guard replacement did not converge exactly once.');
          }
          fs.writeFileSync(path, updated);
          NODE

      - name: Focused storage tests
        run: >-
          npx jest --runInBand
          utils/__tests__/storage.validationContract.test.ts
          utils/__tests__/storage.test.ts

      - name: Typecheck, lint and complexity
        run: |
          npm run typecheck -- --pretty false
          npm run lint:ci
          npm run check:complexity

      - name: Commit hardening and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-storage-validator-prototype-keys-once.yml
          git add utils/storage.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git commit -m 'fix: preserve prototype-like custom storage keys'
          git push origin HEAD:refactor/complexity-storage-validator-map-2026-08-06
