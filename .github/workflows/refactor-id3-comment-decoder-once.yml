name: One-time ID3 comment decoder refactor

on:
  push:
    branches:
      - refactor/complexity-id3-comment-decoder-2026-08-06
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-id3-comment-decoder-refactor
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/complexity-id3-comment-decoder-2026-08-06
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact decoder and baseline refactor
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const sourcePath = 'utils/id3Parser.ts';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const oldBlock = `const decodeComm = (
            bytes: Uint8Array,
            start: number,
            end: number,
          ): { description: string; text: string } | undefined => {
            if (start < 0 || end > bytes.length || end <= start || start + 4 > end)
              return undefined;
            const enc = bytes[start];
            let p = start + 1 + 3;
            let description = '';
          
            if (enc === 0x01 || enc === 0x02) {
              const descStart = p;
              while (p + 1 < end && !(bytes[p] === 0 && bytes[p + 1] === 0)) p += 2;
              description = readUtf16(bytes, descStart, Math.min(p + 2, end)).trim();
              p = p + 1 < end ? p + 2 : end;
              const text = readUtf16(bytes, p, end).trim();
              return { description, text };
            }
          
            const descStart = p;
            while (p < end && bytes[p] !== 0) p += 1;
            description = (
              enc === 0x03 ? readUtf8(bytes, descStart, p) : readLatin1(bytes, descStart, p)
            ).trim();
            p = p < end ? p + 1 : end;
            const text = (
              enc === 0x03 ? readUtf8(bytes, p, end) : readLatin1(bytes, p, end)
            ).trim();
            return { description, text };
          };`;

          const newBlock = `interface Id3CommentLayout {
            descriptionEnd: number;
            textStart: number;
          }
          
          const isUtf16CommentEncoding = (encoding: number): boolean =>
            encoding === 0x01 || encoding === 0x02;
          
          const locateId3CommentText = (
            bytes: Uint8Array,
            descriptionStart: number,
            end: number,
            encoding: number,
          ): Id3CommentLayout => {
            let separatorStart = descriptionStart;
            if (isUtf16CommentEncoding(encoding)) {
              while (
                separatorStart + 1 < end
                && !(bytes[separatorStart] === 0 && bytes[separatorStart + 1] === 0)
              ) separatorStart += 2;
              return {
                descriptionEnd: Math.min(separatorStart + 2, end),
                textStart: separatorStart + 1 < end ? separatorStart + 2 : end,
              };
            }
            while (separatorStart < end && bytes[separatorStart] !== 0) separatorStart += 1;
            return {
              descriptionEnd: separatorStart,
              textStart: separatorStart < end ? separatorStart + 1 : end,
            };
          };
          
          const decodeId3CommentSegment = (
            bytes: Uint8Array,
            start: number,
            end: number,
            encoding: number,
          ): string => {
            if (isUtf16CommentEncoding(encoding)) return readUtf16(bytes, start, end).trim();
            return (
              encoding === 0x03 ? readUtf8(bytes, start, end) : readLatin1(bytes, start, end)
            ).trim();
          };
          
          const decodeComm = (
            bytes: Uint8Array,
            start: number,
            end: number,
          ): { description: string; text: string } | undefined => {
            if (start < 0 || end > bytes.length || end <= start || start + 4 > end)
              return undefined;
            const encoding = bytes[start];
            const descriptionStart = start + 4;
            const layout = locateId3CommentText(bytes, descriptionStart, end, encoding);
            return {
              description: decodeId3CommentSegment(
                bytes,
                descriptionStart,
                layout.descriptionEnd,
                encoding,
              ),
              text: decodeId3CommentSegment(bytes, layout.textStart, end, encoding),
            };
          };`;

          if (!source.includes(oldBlock)) {
            throw new Error('Expected decodeComm block was not found; refusing a broad or partial rewrite.');
          }
          const updatedSource = source.replace(oldBlock, newBlock);
          if (updatedSource === source || updatedSource.includes(oldBlock)) {
            throw new Error('decodeComm replacement did not converge exactly once.');
          }
          fs.writeFileSync(sourcePath, updatedSource);

          const baselinePath = 'security/code-complexity-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const exceptionKey = 'utils/id3Parser.ts::decodeComm#1';
          if (!Object.prototype.hasOwnProperty.call(baseline.exceptions, exceptionKey)) {
            throw new Error(`Expected complexity exception is missing: ${exceptionKey}`);
          }
          delete baseline.exceptions[exceptionKey];
          fs.writeFileSync(baselinePath, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE

      - name: Focused ID3 parser tests
        run: >-
          npx jest --runInBand
          utils/__tests__/id3Parser.commentFrames.test.ts
          utils/__tests__/id3Parser.fromUri.test.ts

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Lint
        run: npm run lint:ci

      - name: Complexity gate
        run: npm run check:complexity

      - name: Commit verified refactor and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refactor-id3-comment-decoder-once.yml
          git add utils/id3Parser.ts security/code-complexity-baseline.json
          printf '%s\n' 'Staged files:'
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'
          git commit -m 'refactor: isolate ID3 comment frame decoding'
          git push origin HEAD:refactor/complexity-id3-comment-decoder-2026-08-06
