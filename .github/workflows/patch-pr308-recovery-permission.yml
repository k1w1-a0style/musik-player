name: Temporary PR308 recovery permission patch

on:
  push:
    branches:
      - cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
    paths:
      - .github/workflows/patch-pr308-recovery-permission.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
      - name: Patch recovery permission ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt')
          text = path.read_text()
          early = '''    if (!store.hasWritePermission(uri) || !store.isWritable(uri)) {
              return TransactionResult(
                success = false,
                errorCode = "RecoveryPending",
                message = "Recovery permission is missing.",
                bytesBefore = journal.originalSizeBytes,
                bytesAfter = journal.rewrittenSizeBytes,
                recoveryPending = true,
              )
            }

          '''
          if early not in text:
              raise SystemExit('expected early permission block not found')
          text = text.replace(early, '', 1)

          old = ''') -> recoverInterruptedWrite(directory, journal)
                else -> preserveExternalEditConflict(directory, journal)
          '''
          new = ''') -> {
                  if (!store.hasWritePermission(uri) || !store.isWritable(uri)) {
                    TransactionResult(
                      success = false,
                      errorCode = "RecoveryPending",
                      message = "Recovery permission is missing for the required restore.",
                      bytesBefore = journal.originalSizeBytes,
                      bytesAfter = journal.rewrittenSizeBytes,
                      recoveryPending = true,
                    )
                  } else {
                    recoverInterruptedWrite(directory, journal)
                  }
                }
                else -> preserveExternalEditConflict(directory, journal)
          '''
          if old not in text:
              raise SystemExit('expected interrupted-write branch not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-pr308-recovery-permission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/expo-system-audio/android/src/main/java/expo/modules/systemaudio/saf/AudioTagTransaction.kt .github/workflows/patch-pr308-recovery-permission.yml
          git commit -m "fix: defer SAF write permission until restore"
          git push origin HEAD:cp40ln-codex/implementiere-dauerhafte-saf-transaktionen
