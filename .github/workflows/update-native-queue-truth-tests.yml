name: Update native queue truth tests

on:
  pull_request:
    branches: [codex]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/update-native-queue-truth-tests.yml'
      - 'scripts/ci/updateNativeQueueTruthTests.cjs'

permissions:
  contents: write

concurrency:
  group: update-native-queue-truth-tests
  cancel-in-progress: false

jobs:
  update-tests:
    if: github.head_ref == 'fix/deep-scan-final-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/deep-scan-final-2026-07-25
          fetch-depth: 0

      - name: Apply exact test-only migration
        run: |
          node scripts/ci/updateNativeQueueTruthTests.cjs
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = 'contexts/__tests__/musicHydrationHelpers.test.ts,contexts/__tests__/useLibraryActions.test.tsx'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify hydration tests
        run: npm test -- --runInBand contexts/__tests__/musicHydrationHelpers.test.ts contexts/__tests__/musicHydrationNativeQueue.test.ts

      - name: Verify library action tests
        run: npm test -- --runInBand contexts/__tests__/useLibraryActions.test.tsx

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Commit test migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contexts/__tests__/musicHydrationHelpers.test.ts contexts/__tests__/useLibraryActions.test.tsx
          git commit -m 'test(queue): require truthful refs after native add'
          git push origin HEAD:fix/deep-scan-final-2026-07-25
