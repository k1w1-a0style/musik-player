# managed-by: k1w1
# workflow-version: 407
name: EAS Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch/Tag/SHA to build"
        required: true
        type: string
      profile:
        description: "EAS build profile (development|preview|production)"
        required: false
        type: string
        default: "development"
      job_id:
        description: "Supabase build job id (optional)"
        required: false
        type: string
        default: ""
      platform:
        description: "Platform"
        required: false
        type: string
        default: "android"
      autofix:
        description: "Allow workflow to write back fixes (lockfile/dev-client) to the
          branch"
        required: false
        type: boolean
        default: false
      strict_lockfile:
        description: "Lockfile policy override (auto|true|false)"
        required: false
        type: string
        default: "auto"
    secrets:
      EXPO_TOKEN:
        required: true
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_APK_BUCKET:
        required: false
      K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: eas-build-${{ inputs.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify reusable build ref contract
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted reusable ref
        id: resolve
        shell: bash
        env:
          RAW_REF: ${{ inputs.ref }}
          RAW_PROFILE: ${{ inputs.profile }}
          RAW_AUTOFIX: ${{ inputs.autofix }}
        run: |
          set -euo pipefail
          REF="$(printf '%s' "$RAW_REF" | tr -d '\r\n')"
          PROFILE="$(printf '%s' "$RAW_PROFILE" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"
          AUTOFIX="$(printf '%s' "$RAW_AUTOFIX" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"

          case "$PROFILE" in
            development|preview|production) ;;
            *) echo "::error::Invalid profile '$PROFILE'."; exit 1 ;;
          esac
          case "$AUTOFIX" in
            true|false) ;;
            *) echo "::error::Invalid autofix value '$AUTOFIX'."; exit 1 ;;
          esac

          git fetch --no-tags origin \
            '+refs/heads/codex:refs/remotes/origin/codex' \
            '+refs/heads/main:refs/remotes/origin/main'
          CODEX_SHA="$(git rev-parse --verify refs/remotes/origin/codex^{commit})"
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main^{commit})"

          if [ "$AUTOFIX" = "true" ]; then
            if [ "$PROFILE" != "development" ] || [ "$REF" != "codex" ]; then
              echo "::error::Reusable autofix requires the explicit codex development ref."
              exit 1
            fi
            printf 'ref=codex\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Reusable non-autofix builds require a verified full 40-character SHA."
            exit 1
          fi
          if ! git cat-file -e "${REF}^{commit}" 2>/dev/null; then
            echo "::error::Requested build SHA is not present in trusted codex/main history."
            exit 1
          fi
          RESOLVED_SHA="$(git rev-parse --verify "${REF}^{commit}")"

          case "$PROFILE" in
            development)
              git merge-base --is-ancestor "$RESOLVED_SHA" "$CODEX_SHA" || {
                echo "::error::Development builds must use a commit reachable from codex."; exit 1;
              }
              ;;
            preview)
              if ! git merge-base --is-ancestor "$RESOLVED_SHA" "$CODEX_SHA" \
                && ! git merge-base --is-ancestor "$RESOLVED_SHA" "$MAIN_SHA"; then
                echo "::error::Preview builds must use a commit reachable from codex or main."
                exit 1
              fi
              ;;
            production)
              if [ "$RESOLVED_SHA" != "$MAIN_SHA" ]; then
                echo "::error::Production builds must use the exact current main head."
                exit 1
              fi
              ;;
          esac
          printf 'ref=%s\n' "$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

  autofix:
    needs: authorize
    name: Auto-fix repo (optional writeback)
    if: ${{ vars.ENABLE_CLOUD_EAS_BUILDS == 'true' && inputs.autofix == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI_VERSION: "20.0.0"
      WORKFLOW_VERSION: "407"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: "🧹 Preflight: clean incomplete native dirs"
        shell: bash
        run: |
          set -euo pipefail
          # Managed workflow guard:
          # If android/ or ios/ exists but is incomplete, EAS can choke.
          # Only delete when we detect it's clearly incomplete.
          if [ -d android ]; then
            if [ ! -f android/build.gradle ] || [ ! -f android/app/build.gradle ]; then
              echo "::warning::Found incomplete android/ directory (missing build.gradle). Removing android/ to allow EAS to regenerate native project."
              rm -rf android
            fi
          fi

          if [ -d ios ]; then
            if [ ! -f ios/Podfile ]; then
              echo "::warning::Found incomplete ios/ directory (missing Podfile). Removing ios/ to allow EAS to regenerate native project."
              rm -rf ios
            fi
          fi

      - name: Detect package manager / lockfile (for cache + install strategy)
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=package-lock.json"
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          elif [ -f npm-shrinkwrap.json ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=npm-shrinkwrap.json"
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=yarn.lock"
              echo "package_manager=yarn"
            } >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=pnpm-lock.yaml"
              echo "package_manager=pnpm"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_lockfile=false"
              echo "lockfile_path="
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Determine strict lockfile policy
        id: strict_lock
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${GH_PROFILE_8777ED}"
          OVERRIDE="${GH_STRICT_LOCKFILE_02D8DA}"
          case "$OVERRIDE" in
            true)
              echo "strict=true" >> "$GITHUB_OUTPUT"
              ;;
            false)
              if [ "$PROFILE" != "development" ]; then
                echo "::error::strict_lockfile=false is only allowed for development profile. Preview/production remain fail-closed."
                exit 1
              fi
              echo "strict=false" >> "$GITHUB_OUTPUT"
              ;;
            ""|auto)
              case "$PROFILE" in
                preview|production)
                  echo "strict=true" >> "$GITHUB_OUTPUT"
                  ;;
                development)
                  echo "strict=false" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "::error::Unknown profile '$PROFILE' while computing strict lockfile policy"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Invalid strict_lockfile override '$OVERRIDE' (allowed: auto|true|false)"
              exit 1
              ;;
          esac
        env:
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_STRICT_LOCKFILE_02D8DA: ${{ inputs.strict_lockfile }}

      - name: Setup Node (npm cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (yarn cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'yarn'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (pnpm cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'pnpm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (no cache - lockfile missing)
        if: steps.lock.outputs.has_lockfile != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies (policy-aware)
        id: install_deps
        shell: bash
        env:
          STRICT_LOCKFILE: ${{ steps.strict_lock.outputs.strict }}
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_PACKAGE_MANAGER_9162DF: ${{ steps.lock.outputs.package_manager }}
          GH_LOCKFILE_PATH_BB7E6E: ${{ steps.lock.outputs.lockfile_path }}
          GH_HAS_LOCKFILE_7F5283: ${{ steps.lock.outputs.has_lockfile }}
        run: |
          set -euo pipefail
          PROFILE="${GH_PROFILE_8777ED}"
          PM="${GH_PACKAGE_MANAGER_9162DF}"
          LOCKFILE="${GH_LOCKFILE_PATH_BB7E6E}"
          if [ "${GH_HAS_LOCKFILE_7F5283}" = "true" ]; then
            case "$PM" in
              npm)
                echo "Using npm ci (lockfile: ${LOCKFILE})"
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                npm ci --no-audit --no-fund
                ;;
              yarn)
                echo "Using yarn install --immutable (lockfile: ${LOCKFILE})"
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                corepack enable || true
                yarn install --immutable
                ;;
              pnpm)
                echo "Using pnpm install --frozen-lockfile (lockfile: ${LOCKFILE})"
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                corepack enable || true
                pnpm install --frozen-lockfile
                ;;
              *)
                echo "::error::Unknown package manager '$PM'"
                exit 1
                ;;
            esac
          elif [ "${STRICT_LOCKFILE}" = "true" ]; then
            echo "::error::Strict lockfile policy enabled for profile '${PROFILE}', but no lockfile was found. Commit package-lock.json, npm-shrinkwrap.json, yarn.lock or pnpm-lock.yaml before running preview/production builds."
            exit 1
          else
            echo "::warning::No lockfile found in repo. Development profile allows fallback to npm install (non-reproducible)."
            echo "mode=fallback-npm-install" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          fi

      - name: Install EAS CLI (pinned)
        shell: bash
        run: |
          set -euo pipefail
          npm i -g "eas-cli@${EAS_CLI_VERSION}"
          eas --version | tee ci-logs/eas-version.log

      - name: Verify EAS auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi
          eas whoami | tee ci-logs/eas-whoami.log

      - name: Auto-fix repo (lockfile + dev client) [optional writeback]
        shell: bash
        env:
          TARGET_BRANCH: ${{ needs.authorize.outputs.ref }}
          PROFILE: ${{ inputs.profile }}
          PACKAGE_MANAGER: ${{ steps.lock.outputs.package_manager }}
          HAS_LOCKFILE: ${{ steps.lock.outputs.has_lockfile }}
          LOCKFILE_PATH: ${{ steps.lock.outputs.lockfile_path }}
          ALLOWED_REF_REGEX: "^(work|codex|dev|develop)$"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PM="${PACKAGE_MANAGER:-npm}"
          echo "🧯 Auto-fix: lockfile + expo-dev-client (development only)."
          if [ "$PM" != "npm" ]; then
            echo "::notice::Auto-fix writeback currently supports npm-managed repos only. Detected package manager '$PM'; skipping writeback path."
            exit 0
          fi

          npm config set package-lock true

          if [ "${PROFILE}" = "development" ]; then
            echo "📦 Ensuring expo-dev-client for development builds..."
            npx --yes expo install expo-dev-client --fix || npx --yes expo install expo-dev-client
          fi

          if [ "${HAS_LOCKFILE}" != "true" ] || [ ! -f "${LOCKFILE_PATH:-package-lock.json}" ]; then
            echo "::warning::No npm lockfile found. Generating package-lock.json (best effort)."
            npm install --package-lock-only --no-audit --no-fund
          fi

          # Determine if package.json / package-lock.json / .npmrc changed (modified or untracked)
          if ! git status --porcelain -- package.json package-lock.json .npmrc | grep -q .; then
            echo "ℹ️ No CI auto-fix changes to write back."
            exit 0
          fi

          BR="${TARGET_BRANCH:-}"
          if [ -z "$BR" ]; then
            echo "::warning::No TARGET_BRANCH provided; skipping writeback."
            exit 0
          fi

          if echo "$BR" | grep -qE '^[0-9a-fA-F]{7,40}$'; then
            echo "::warning::Ref looks like a SHA ($BR). Skipping writeback."
            exit 0
          fi
          if echo "$BR" | grep -qE '[: ]'; then
            echo "::warning::Unsafe ref ($BR). Skipping writeback."
            exit 0
          fi
          if ! echo "$BR" | grep -qE "${ALLOWED_REF_REGEX}"; then
            echo "::warning::Writeback disabled for branch '$BR' (regex: ${ALLOWED_REF_REGEX})."
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "::warning::Ref '$BR' is not a remote branch. Skipping writeback."
            exit 0
          fi

          echo "✅ Auto-fix changes detected -> committing back to '$BR'."
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json .npmrc 2>/dev/null || true
          git commit -m "chore(ci): auto-fix lockfile/dev-client [skip ci]" || true

          echo "🚀 Pushing to origin $BR (best effort)..."
          git push origin "HEAD:$BR" || echo "::warning::Could not push auto-fix commit (branch may be protected)."

  build:
    needs: [ authorize, autofix ]
    if: ${{ vars.ENABLE_CLOUD_EAS_BUILDS == 'true' && always() &&
      needs.authorize.result == 'success' && (needs.autofix.result == 'success' || needs.autofix.result == 'skipped')
      }}
    permissions:
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI_VERSION: "20.0.0"

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY: ${{ secrets.K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY }}
      RAW_JOB_ID: ${{ inputs.job_id }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [ -n "${RAW_JOB_ID:-}" ] && [[ ! "${RAW_JOB_ID}" =~ ${UUID_RE} ]]; then
            echo "::error::job_id must be empty or a canonical UUID."
            exit 1
          fi
          VALIDATED_JOB_ID="${RAW_JOB_ID:-}"
          printf 'VALIDATED_JOB_ID=%s\n' "${VALIDATED_JOB_ID}" >> "$GITHUB_ENV"

          case "${GH_PROFILE_8777ED}" in
            development|preview|production) ;;
            *)
              echo "::error::Invalid profile: '${GH_PROFILE_8777ED}' (allowed: development|preview|production)"
              exit 1
              ;;
          esac

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

          if [ "${GH_PROFILE_8777ED}" = "production" ]; then
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY:-}" ]; then
              echo "::error::Production build requires SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY."
              exit 1
            fi
          fi

          echo "ARTIFACT_EXT=apk" >> "$GITHUB_ENV"

          case "${GH_PROFILE_8777ED}" in
            development)
              EXPECTED_EAS_ENVIRONMENT="development"
              EXPECTED_ANDROID_PACKAGE="com.k1w1a0style.musikplayer.dev"
              ;;
            preview)
              EXPECTED_EAS_ENVIRONMENT="preview"
              EXPECTED_ANDROID_PACKAGE="com.k1w1a0style.musikplayer"
              ;;
            production)
              EXPECTED_EAS_ENVIRONMENT="production"
              EXPECTED_ANDROID_PACKAGE="com.k1w1a0style.musikplayer"
              ;;
          esac
          EXPECTED_LABEL="k1w1-Musik"

          echo "Requested profile: ${GH_PROFILE_8777ED}"
          echo "Expected EAS environment for profile: ${EXPECTED_EAS_ENVIRONMENT}"
          echo "Expected Android package: ${EXPECTED_ANDROID_PACKAGE}"
          echo "Expected label: ${EXPECTED_LABEL}"

          {
            echo "EXPECTED_EAS_ENVIRONMENT=${EXPECTED_EAS_ENVIRONMENT}"
            echo "EXPECTED_ANDROID_PACKAGE=${EXPECTED_ANDROID_PACKAGE}"
            echo "EXPECTED_LABEL=${EXPECTED_LABEL}"
          } >> "$GITHUB_ENV"

          if [ -z "${VALIDATED_JOB_ID:-}" ]; then
            echo "has_job_id=false" >> "$GITHUB_ENV"
          else
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              echo "::warning::VALIDATED_JOB_ID provided, but SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY missing -> status updates will be skipped."
              echo "has_job_id=false" >> "$GITHUB_ENV"
            else
              echo "has_job_id=true" >> "$GITHUB_ENV"
            fi
          fi
        env:
          GH_PROFILE_8777ED: ${{ inputs.profile }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.authorize.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare build diagnostics dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs

      - name: "🧹 Preflight: clean incomplete native dirs"
        shell: bash
        run: |
          set -euo pipefail
          # Managed workflow guard:
          # If android/ or ios/ exists but is incomplete, EAS/Expo can choke.
          # Only delete when it's clearly incomplete (missing the canonical files).

          if [ -d android ]; then
            if [ ! -f android/build.gradle ] || [ ! -f android/app/build.gradle ]; then
              echo "::warning::Found incomplete android/ directory (missing build.gradle). Removing to allow managed EAS build to regenerate native project."
              rm -rf android
            fi
          fi

          if [ -d ios ]; then
            if [ ! -f ios/Podfile ]; then
              echo "::warning::Found incomplete ios/ directory (missing Podfile). Removing to allow managed EAS build to regenerate native project."
              rm -rf ios
            fi
          fi

      - name: Detect package manager / lockfile (for cache + install strategy)
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=package-lock.json"
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          elif [ -f npm-shrinkwrap.json ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=npm-shrinkwrap.json"
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=yarn.lock"
              echo "package_manager=yarn"
            } >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            {
              echo "has_lockfile=true"
              echo "lockfile_path=pnpm-lock.yaml"
              echo "package_manager=pnpm"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_lockfile=false"
              echo "lockfile_path="
              echo "package_manager=npm"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "Repo root: $(pwd)"
          echo "Files:"; ls -lah

      - name: Determine strict lockfile policy
        id: strict_lock
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${GH_PROFILE_8777ED}"
          OVERRIDE="${GH_STRICT_LOCKFILE_02D8DA}"
          case "$OVERRIDE" in
            true)
              echo "strict=true" >> "$GITHUB_OUTPUT"
              ;;
            false)
              if [ "$PROFILE" != "development" ]; then
                echo "::error::strict_lockfile=false is only allowed for development profile. Preview/production remain fail-closed."
                exit 1
              fi
              echo "strict=false" >> "$GITHUB_OUTPUT"
              ;;
            ""|auto)
              case "$PROFILE" in
                preview|production)
                  echo "strict=true" >> "$GITHUB_OUTPUT"
                  ;;
                development)
                  echo "strict=false" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "::error::Unknown profile '$PROFILE' while computing strict lockfile policy"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Invalid strict_lockfile override '$OVERRIDE' (allowed: auto|true|false)"
              exit 1
              ;;
          esac
        env:
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_STRICT_LOCKFILE_02D8DA: ${{ inputs.strict_lockfile }}

      - name: Setup Node (npm cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'npm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (yarn cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'yarn'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (pnpm cache)
        if: steps.lock.outputs.has_lockfile == 'true' &&
          steps.lock.outputs.package_manager == 'pnpm'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path }}

      - name: Setup Node (no cache - lockfile missing)
        if: steps.lock.outputs.has_lockfile != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies (policy-aware)
        id: install_deps
        shell: bash
        env:
          STRICT_LOCKFILE: ${{ steps.strict_lock.outputs.strict }}
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_PACKAGE_MANAGER_9162DF: ${{ steps.lock.outputs.package_manager }}
          GH_LOCKFILE_PATH_BB7E6E: ${{ steps.lock.outputs.lockfile_path }}
          GH_HAS_LOCKFILE_7F5283: ${{ steps.lock.outputs.has_lockfile }}
        run: |
          set -euo pipefail
          PROFILE="${GH_PROFILE_8777ED}"
          PM="${GH_PACKAGE_MANAGER_9162DF}"
          LOCKFILE="${GH_LOCKFILE_PATH_BB7E6E}"
          if [ "${GH_HAS_LOCKFILE_7F5283}" = "true" ]; then
            case "$PM" in
              npm)
                echo "Using npm ci (lockfile: ${LOCKFILE})"
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                npm ci --no-audit --no-fund
                ;;
              yarn)
                echo "Using yarn install --immutable (lockfile: ${LOCKFILE})"
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                corepack enable || true
                yarn install --immutable
                ;;
              pnpm)
                echo "Using pnpm install --frozen-lockfile (lockfile: ${LOCKFILE})"
                echo "mode=lockfile-${PM}" >> "$GITHUB_OUTPUT"
                corepack enable || true
                pnpm install --frozen-lockfile
                ;;
              *)
                echo "::error::Unknown package manager '$PM'"
                exit 1
                ;;
            esac
          elif [ "${STRICT_LOCKFILE}" = "true" ]; then
            echo "::error::Strict lockfile policy enabled for profile '${PROFILE}', but no lockfile was found. Commit package-lock.json, npm-shrinkwrap.json, yarn.lock or pnpm-lock.yaml before running preview/production builds."
            exit 1
          else
            echo "::warning::No lockfile found in repo. Development profile allows fallback to npm install (non-reproducible)."
            echo "mode=fallback-npm-install" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          fi

      - name: Install EAS CLI (pinned)
        shell: bash
        run: |
          set -euo pipefail
          npm i -g "eas-cli@${EAS_CLI_VERSION}"
          eas --version | tee ci-logs/eas-version.log

      - name: Verify EAS auth
        shell: bash
        run: |
          set -euo pipefail
          eas whoami | tee ci-logs/eas-whoami.log

      - name: Production credential preflight
        if: ${{ inputs.profile == 'production' }}
        shell: bash
        env:
          K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY: ${{ secrets.K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY }}
          WORKFLOW_REF: ${{ needs.authorize.outputs.ref }}
        run: |
          set -euo pipefail
          echo "::add-mask::${SUPABASE_SERVICE_ROLE_KEY}"
          if [ -z "${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY:-}" ]; then
            echo "::error::Missing K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY for production keystore export."
            exit 1
          fi
          if [ -n "${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY:-}" ]; then
            echo "::add-mask::${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY}"
          fi
          node -e '
            const fs = require("fs");
            const payload = {
              repo: process.env.GITHUB_REPOSITORY,
              mode: "production",
              run_id: process.env.GITHUB_RUN_ID,
              ref: process.env.WORKFLOW_REF || "",
              profile: "production"
            };
            fs.mkdirSync("ci-logs", { recursive: true });
            fs.writeFileSync("ci-logs/keystore-request.json", JSON.stringify(payload, null, 2));
          '

      - name: Fetch Android keystore (production only)
        if: ${{ inputs.profile == 'production' }}
        shell: bash
        env:
          K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY: ${{ secrets.K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          CURL_ARGS=(
            --silent
            --show-error
            --retry 3
            --retry-all-errors
            --connect-timeout 10
            --max-time 60
            -o ci-logs/keystore-response.raw.json
            -w "%{http_code}"
            -X POST "${SUPABASE_URL%/}/functions/v1/android-keystore-export"
            -H "Content-Type: application/json"
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
            -d @ci-logs/keystore-request.json
          )

          if [ -n "${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY:-}" ]; then
            CURL_ARGS+=(-H "x-k1w1-admin-key: ${K1W1_EDGE_ANDROID_KEYSTORE_EXPORT_ADMIN_KEY}")
          fi

          HTTP_CODE="$(
            curl "${CURL_ARGS[@]}"
          )"

          echo "$HTTP_CODE" > ci-logs/keystore-response.http_code

          node scripts/ci/summarizeKeystoreResponse.cjs \
            ci-logs/keystore-response.raw.json \
            ci-logs/keystore-response.summary.json \
            "${HTTP_CODE}"

      - name: Validate keystore export structure
        if: ${{ inputs.profile == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(cat ci-logs/keystore-response.http_code)"
          node scripts/ci/summarizeKeystoreResponse.cjs \
            ci-logs/keystore-response.raw.json \
            ci-logs/keystore-response.summary.json \
            "${HTTP_CODE}"

      - name: Write Android signing files
        if: ${{ inputs.profile == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/writeAndroidSigningFilesFromExport.cjs < ci-logs/keystore-response.raw.json
          test -f credentials.json
          test -f android-upload-keystore.p12

      - name: Update Build Status - Building
        if: env.has_job_id == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="${GH_RUN_ID_DFF96A}"
          PROFILE="${GH_PROFILE_8777ED}"
          SOURCE_COMMIT_SHA="$(git rev-parse HEAD)"
          JSON="$(node -e 'console.log(JSON.stringify({status:"building",build_profile:process.argv[1],github_run_id:process.argv[2],started_at:process.argv[3],source_commit_sha:process.argv[4]}))' "${PROFILE}" "${RUN_ID}" "${TS}" "${SOURCE_COMMIT_SHA}")"
          curl --fail-with-body --silent --show-error             -X PATCH "${SUPABASE_URL%/}/rest/v1/build_jobs?id=eq.${VALIDATED_JOB_ID}"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Content-Type: application/json"             -H "Prefer: return=minimal"             -d "${JSON}"             || echo "::warning::Failed to update Supabase status (building)"
        env:
          GH_RUN_ID_DFF96A: ${{ github.run_id }}
          GH_PROFILE_8777ED: ${{ inputs.profile }}

      - name: Run EAS Build (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${GH_PROFILE_8777ED}"
          PLATFORM="${GH_PLATFORM_A5C067}"
          echo "🚀 Starting EAS build (platform=${PLATFORM}, profile=${PROFILE}) with --wait..."
          BUILD_OUTPUT="$(eas build --platform "${PLATFORM}" --profile "${PROFILE}" --non-interactive --wait 2>&1)" || {
            CODE=$?
            printf '%s\n' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs redact-urls | tee ci-logs/eas-build.log
            if echo "${BUILD_OUTPUT}" | grep -q "Generating a new Keystore is not supported in --non-interactive mode"; then
              echo "::error::Android signing keystore is missing on EAS. Fix: run 'eas credentials -p android' once locally (interactive) to generate/upload a keystore, or configure Android credentials in the Expo dashboard, then rerun the workflow."
            fi
            if echo "${BUILD_OUTPUT}" | grep -qiE "build\.gradle|android/app"; then
              echo "::warning::Build mentions Android native files. If this is a managed Expo project, ensure no partial 'android/' folder is committed (or let the workflow preflight delete it)."
            fi
            echo "::error::EAS build failed (exit ${CODE})"
            exit "${CODE}"
          }
          printf '%s\n' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs redact-urls | tee ci-logs/eas-build.log
          BUILD_ID="$(printf '%s' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs extract-build-id)"
          BUILD_URL="$(printf '%s' "${BUILD_OUTPUT}" | node scripts/ci/resolveEasBuildArtifact.cjs extract-build-url)"
          if [ -z "${BUILD_ID}" ]; then
            echo "::error::Could not extract EAS build ID from successful EAS output. See diagnostics artifact."
            exit 1
          fi
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          echo "build_url=${BUILD_URL}" >> "${GITHUB_OUTPUT}"
        env:
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_PLATFORM_A5C067: ${{ inputs.platform }}

      - name: Download Android Artifact
        id: download_artifact
        if: steps.eas.outputs.build_id != ''
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${RUNNER_TEMP:-/tmp}/k1w1-artifacts"
          mkdir -p "${ARTIFACT_DIR}"
          OUT="${ARTIFACT_DIR}/k1w1-${GH_PROFILE_8777ED}.${ARTIFACT_EXT}"
          echo "Expected Android artifact path: ${OUT}"
          echo "EAS build ID: ${GH_BUILD_ID_E68394}"
          BUILD_ID="${GH_BUILD_ID_E68394}"
          PROFILE="${GH_PROFILE_8777ED}"
          case "${PROFILE}" in
            development|preview) EXPECTED_DISTRIBUTION="internal" ;;
            production) EXPECTED_DISTRIBUTION="store" ;;
            *) echo "::error::Unexpected build profile."; exit 1 ;;
          esac
          BUILD_JSON="$(mktemp)"
          trap 'rm -f "${BUILD_JSON}"' EXIT
          eas build:view "${BUILD_ID}" --json > "${BUILD_JSON}"
          ARTIFACT_URL="$(node scripts/ci/resolveEasBuildArtifact.cjs artifact-url \
            "${BUILD_ID}" "${PROFILE}" "${PROFILE}" "${EXPECTED_DISTRIBUTION}" < "${BUILD_JSON}")"
          rm -f "${BUILD_JSON}"
          echo "Validated structured EAS artifact metadata (URL present, value redacted)."
          rm -f "${OUT}"
          curl --fail --location --retry 3 --retry-delay 5 --output "${OUT}" "${ARTIFACT_URL}"

          if ! test -s "${OUT}"; then
            echo "::error::EAS build succeeded, but the validated artifact download did not produce a non-empty APK. Build ID=${GH_BUILD_ID_E68394} Expected output=${OUT}"
            echo "${ARTIFACT_DIR}/ contents:"
            find "${ARTIFACT_DIR}" -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null || true
            exit 1
          fi

          case "${OUT}" in
            *.apk) ;;
            *)
              echo "::error::Expected an APK artifact for Android profile '${GH_PROFILE_8777ED}', got ${OUT}."
              exit 1
              ;;
          esac

          echo "artifact_path=${OUT}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=eas-${GH_PLATFORM_A5C067}-${GH_PROFILE_8777ED}-${GH_RUN_NUMBER_DA38B2}-apk" >> "${GITHUB_OUTPUT}"
          ls -lah "${ARTIFACT_DIR}"
        env:
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_BUILD_ID_E68394: ${{ steps.eas.outputs.build_id }}
          GH_PLATFORM_A5C067: ${{ inputs.platform }}
          GH_RUN_NUMBER_DA38B2: ${{ github.run_number }}

      - name: Resolve Android SDK build tools
        if: steps.download_artifact.outputs.artifact_path != ''
        shell: bash
        run: |
          set -euo pipefail
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            if [ -n "${root}" ] && [ -d "${root}/build-tools" ]; then
              latest_build_tools="$(find "${root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
              if [ -n "${latest_build_tools}" ]; then
                echo "Using Android build tools: ${latest_build_tools}"
                echo "${latest_build_tools}" >> "${GITHUB_PATH}"
                export PATH="${latest_build_tools}:${PATH}"
                break
              fi
            fi
          done
          if ! command -v aapt >/dev/null 2>&1 && ! command -v aapt2 >/dev/null 2>&1; then
            echo "::error::aapt/aapt2 not found; cannot validate APK package, label, SDK levels, ABI metadata, or permissions."
            exit 1
          fi
          if ! command -v apksigner >/dev/null 2>&1; then
            echo "::error::apksigner not found; cannot validate APK signature."
            exit 1
          fi
          command -v aapt || true
          command -v aapt2 || true
          command -v apksigner

      - name: Inspect downloaded Android APK
        id: inspect_apk
        if: steps.download_artifact.outputs.artifact_path != ''
        shell: bash
        run: |
          set -euo pipefail
          case "${GH_PROFILE_8777ED}" in
            development)
              EXPECTED_PACKAGE="com.k1w1a0style.musikplayer.dev"
              ;;
            preview|production)
              EXPECTED_PACKAGE="com.k1w1a0style.musikplayer"
              ;;
            *)
              echo "::error::Unexpected profile '${GH_PROFILE_8777ED}' while validating APK metadata."
              exit 1
              ;;
          esac
          node scripts/ci/inspectAndroidApk.cjs \
            "${GH_ARTIFACT_PATH_97F6CF}" \
            --expected-package "${EXPECTED_PACKAGE}" \
            --expected-label "k1w1-Musik" \
            --min-size-bytes 10000001 \
            --require-badging \
            --require-signature \
            | tee ci-logs/android-apk-inspection.log
        env:
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_ARTIFACT_PATH_97F6CF: ${{ steps.download_artifact.outputs.artifact_path }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eas-build-diagnostics-${{ github.run_number }}
          path: |
            ci-logs/eas-version.log
            ci-logs/eas-whoami.log
            ci-logs/eas-build.log
            ci-logs/android-apk-inspection.log
            ci-logs/keystore-response.http_code
            ci-logs/keystore-response.summary.json
            !ci-logs/keystore-response.raw.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf ci-credentials
          rm -f credentials.json android-upload-keystore.p12
          rm -f android/keystore.jks android/app/keystore.jks android/keystore.properties
          rm -f ci-logs/keystore-response.raw.json
          true

      - name: Upload Android APK Artifact
        if: steps.inspect_apk.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.download_artifact.outputs.artifact_name }}
          path: ${{ steps.download_artifact.outputs.artifact_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## EAS Build Summary

          - Workflow version: ${WORKFLOW_VERSION}
          - Repo: ${GH_REPOSITORY_39E62C}
          - Input ref: ${GH_REF_04E218}
          - Input profile: ${GH_PROFILE_8777ED}
          - Platform: ${GH_PLATFORM_A5C067}
          - Checked out: $(git rev-parse HEAD)
          - Package manager: ${GH_PACKAGE_MANAGER_9162DF}
          - Lockfile present: ${GH_HAS_LOCKFILE_7F5283}
          - Lockfile path: ${GH_LOCKFILE_PATH_BB7E6E}
          - Strict lockfile policy: ${GH_STRICT_5F311E}
          - Dependency install mode: ${GH_MODE_286F08}
          - EAS CLI: $(eas --version 2>/dev/null || echo "unknown")
          - Build ID: ${GH_BUILD_ID_E68394}
          - Diagnostics artifact: eas-build-diagnostics-${GH_RUN_NUMBER_DA38B2}
          - APK artifact: ${GH_ARTIFACT_NAME_639E28}
          - APK path: ${GH_ARTIFACT_PATH_97F6CF}

          Artifacts: https://github.com/${GH_REPOSITORY_39E62C}/actions/runs/${GH_RUN_ID_DFF96A}
          EOF
        env:
          GH_REPOSITORY_39E62C: ${{ github.repository }}
          GH_REF_04E218: ${{ needs.authorize.outputs.ref }}
          GH_PROFILE_8777ED: ${{ inputs.profile }}
          GH_PLATFORM_A5C067: ${{ inputs.platform }}
          GH_PACKAGE_MANAGER_9162DF: ${{ steps.lock.outputs.package_manager }}
          GH_HAS_LOCKFILE_7F5283: ${{ steps.lock.outputs.has_lockfile }}
          GH_LOCKFILE_PATH_BB7E6E: ${{ steps.lock.outputs.lockfile_path }}
          GH_STRICT_5F311E: ${{ steps.strict_lock.outputs.strict }}
          GH_MODE_286F08: ${{ steps.install_deps.outputs.mode }}
          GH_BUILD_ID_E68394: ${{ steps.eas.outputs.build_id }}
          GH_RUN_NUMBER_DA38B2: ${{ github.run_number }}
          GH_ARTIFACT_NAME_639E28: ${{ steps.download_artifact.outputs.artifact_name }}
          GH_ARTIFACT_PATH_97F6CF: ${{ steps.download_artifact.outputs.artifact_path }}
          GH_RUN_ID_DFF96A: ${{ github.run_id }}

      - name: Update Build Status - Success
        if: success() && env.has_job_id == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="${GH_RUN_ID_DFF96A}"
          BUILD_ID="${GH_BUILD_ID_E68394}"
          BUILD_URL="${GH_BUILD_URL_8BCACD}"
          SOURCE_COMMIT_SHA="$(git rev-parse HEAD)"
          JSON="$(node -e 'console.log(JSON.stringify({status:"completed",github_run_id:process.argv[1],eas_build_id:process.argv[2],build_url:(process.argv[3]||null),completed_at:process.argv[4],source_commit_sha:process.argv[5]}))' "${RUN_ID}" "${BUILD_ID}" "${BUILD_URL}" "${TS}" "${SOURCE_COMMIT_SHA}")"
          curl --fail-with-body --silent --show-error             -X PATCH "${SUPABASE_URL%/}/rest/v1/build_jobs?id=eq.${VALIDATED_JOB_ID}"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Content-Type: application/json"             -H "Prefer: return=minimal"             -d "${JSON}"             || echo "::warning::Failed to update Supabase status (success)"
        env:
          GH_RUN_ID_DFF96A: ${{ github.run_id }}
          GH_BUILD_ID_E68394: ${{ steps.eas.outputs.build_id }}
          GH_BUILD_URL_8BCACD: ${{ steps.eas.outputs.build_url }}

      - name: Update Build Status - Failed
        if: failure() && env.has_job_id == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="${GH_RUN_ID_DFF96A}"
          ERR="Build failed. Check logs: https://github.com/${GH_REPOSITORY_39E62C}/actions/runs/${GH_RUN_ID_DFF96A}"
          SOURCE_COMMIT_SHA="$(git rev-parse HEAD)"
          JSON="$(node -e 'console.log(JSON.stringify({status:"error",github_run_id:process.argv[1],error_message:process.argv[2],completed_at:process.argv[3],source_commit_sha:process.argv[4]}))' "${RUN_ID}" "${ERR}" "${TS}" "${SOURCE_COMMIT_SHA}")"
          curl --fail-with-body --silent --show-error             -X PATCH "${SUPABASE_URL%/}/rest/v1/build_jobs?id=eq.${VALIDATED_JOB_ID}"             -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"             -H "Content-Type: application/json"             -H "Prefer: return=minimal"             -d "${JSON}"             || echo "::warning::Failed to update Supabase status (failed)"
        env:
          GH_RUN_ID_DFF96A: ${{ github.run_id }}
          GH_REPOSITORY_39E62C: ${{ github.repository }}
