# KORRIGIERT: (V4) Behebt den '--output' Fehler.
name: EAS Build (Variante A)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID from K1W1 App'
        required: false

jobs:
  run-eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Expo und EAS einrichten
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Abhängigkeiten installieren
        run: npm install

      - name: EAS Build starten (KORRIGIERT)
        # --no-wait: Startet den Build und beendet die Action sofort.
        # Das Polling in der App (CustomHeader) übernimmt die Statusprüfung.
        run: |
          eas build \
            --platform android \
            --non-interactive \
            --no-wait
