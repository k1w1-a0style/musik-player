name: K1W1 Triggered Build
run-name: "EAS ${{ github.event.client_payload.build_profile || github.event.inputs.profile || 'development' }} • ${{ github.event.client_payload.ref || github.event.inputs.ref }}"

on:
  repository_dispatch:
    types: [trigger-eas-build]
  workflow_dispatch:
    inputs:
      ref:
        description: "Trusted branch (codex|main) or full 40-character commit SHA"
        required: true
      profile:
        description: "EAS build profile (development|preview|production)"
        required: false
        default: "development"
      job_id:
        description: "Optional build_jobs id to update in Supabase"
        required: false
        default: ""
      autofix:
        description: "Allow workflow to write back lockfile/dev-client fixes"
        required: false
        type: boolean
        default: false
      strict_lockfile:
        description: "Lockfile policy override (auto|true|false)"
        required: false
        type: choice
        options: [auto, "true", "false"]
        default: auto

permissions:
  contents: read

concurrency:
  group: >-
    k1w1-triggered-build-
    ${{ github.event.client_payload.ref || github.event.inputs.ref }}-
    ${{ github.event.client_payload.build_profile || github.event.client_payload.buildProfile || github.event.inputs.profile || 'development' }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve and authorize explicit ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      profile: ${{ steps.resolve.outputs.profile }}
      job_id: ${{ steps.resolve.outputs.job_id }}
      autofix: ${{ steps.resolve.outputs.autofix }}
      strict_lockfile: ${{ steps.resolve.outputs.strict_lockfile }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve inputs and enforce trusted commit ancestry
        id: resolve
        shell: bash
        env:
          RAW_REF: ${{ github.event.client_payload.ref || github.event.inputs.ref || '' }}
          RAW_PROFILE: ${{ github.event.client_payload.build_profile || github.event.client_payload.buildProfile || github.event.inputs.profile || 'development' }}
          RAW_JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id || '' }}
          RAW_AUTOFIX: ${{ github.event.client_payload.autofix || (github.event_name == 'workflow_dispatch' && inputs.autofix) || false }}
          RAW_STRICT_LOCKFILE: ${{ github.event.client_payload.strict_lockfile || (github.event_name == 'workflow_dispatch' && inputs.strict_lockfile) || 'auto' }}
        run: |
          set -euo pipefail

          REF="$(printf '%s' "$RAW_REF" | tr -d '\r\n')"
          PROFILE_RAW="$(printf '%s' "$RAW_PROFILE" | tr -d '\r\n')"
          JOB_ID_RAW="$RAW_JOB_ID"
          AUTOFIX_RAW="$(printf '%s' "$RAW_AUTOFIX" | tr -d '\r\n')"
          STRICT_LOCKFILE_RAW="$(printf '%s' "$RAW_STRICT_LOCKFILE" | tr -d '\r\n')"

          if [ -z "$REF" ]; then
            echo "::error::Missing required ref."
            exit 1
          fi
          if [ "${#REF}" -gt 40 ]; then
            echo "::error::Invalid ref: only codex, main, or a full 40-character SHA is allowed."
            exit 1
          fi
          if [[ "$REF" =~ [[:cntrl:]] ]] || [[ "$REF" =~ [[:space:]] ]]; then
            echo "::error::Invalid ref: control or space characters are not allowed."
            exit 1
          fi
          if [[ "$REF" != "codex" && "$REF" != "main" && ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid ref: only codex, main, or a full 40-character SHA is allowed."
            exit 1
          fi

          PROFILE="$(printf '%s' "$PROFILE_RAW" | tr '[:upper:]' '[:lower:]')"
          case "$PROFILE" in
            development|preview|production) ;;
            *)
              echo "::error::Invalid profile '$PROFILE_RAW' (allowed: development|preview|production)."
              exit 1
              ;;
          esac

          JOB_ID="$JOB_ID_RAW"
          UUID_RE='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [ -n "$JOB_ID" ] && [[ ! "$JOB_ID" =~ ${UUID_RE} ]]; then
            echo "::error::Invalid job_id: expected empty or a canonical UUID."
            exit 1
          fi

          AUTOFIX_LOWER="$(printf '%s' "$AUTOFIX_RAW" | tr '[:upper:]' '[:lower:]')"
          case "$AUTOFIX_LOWER" in
            true|1|yes|y|on) AUTOFIX="true" ;;
            false|0|no|n|off|"") AUTOFIX="false" ;;
            *)
              echo "::error::Invalid autofix '$AUTOFIX_RAW' (allowed bool values only)."
              exit 1
              ;;
          esac

          STRICT_LOCKFILE="$(printf '%s' "$STRICT_LOCKFILE_RAW" | tr '[:upper:]' '[:lower:]')"
          case "$STRICT_LOCKFILE" in
            auto|true|false) ;;
            *)
              echo "::error::Invalid strict_lockfile '$STRICT_LOCKFILE_RAW' (allowed: auto|true|false)."
              exit 1
              ;;
          esac

          git fetch --no-tags origin \
            '+refs/heads/codex:refs/remotes/origin/codex' \
            '+refs/heads/main:refs/remotes/origin/main'

          CODEX_SHA="$(git rev-parse --verify refs/remotes/origin/codex^{commit})"
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          case "$REF" in
            codex) RESOLVED_SHA="$CODEX_SHA" ;;
            main) RESOLVED_SHA="$MAIN_SHA" ;;
            *)
              if ! git cat-file -e "${REF}^{commit}" 2>/dev/null; then
                echo "::error::Requested SHA is not present in the trusted codex/main history."
                exit 1
              fi
              RESOLVED_SHA="$(git rev-parse --verify "${REF}^{commit}")"
              ;;
          esac

          case "$PROFILE" in
            development)
              if ! git merge-base --is-ancestor "$RESOLVED_SHA" "$CODEX_SHA"; then
                echo "::error::Development builds must use a commit reachable from codex."
                exit 1
              fi
              ;;
            preview)
              if ! git merge-base --is-ancestor "$RESOLVED_SHA" "$CODEX_SHA" \
                && ! git merge-base --is-ancestor "$RESOLVED_SHA" "$MAIN_SHA"; then
                echo "::error::Preview builds must use a commit reachable from codex or main."
                exit 1
              fi
              ;;
            production)
              if [ "$RESOLVED_SHA" != "$MAIN_SHA" ]; then
                echo "::error::Production builds must use the exact current main head."
                exit 1
              fi
              ;;
          esac

          OUTPUT_REF="$RESOLVED_SHA"
          if [ "$AUTOFIX" = "true" ]; then
            if [ "$PROFILE" != "development" ] || [ "$REF" != "codex" ]; then
              echo "::error::Autofix is allowed only for an explicit development build of codex."
              exit 1
            fi
            OUTPUT_REF="codex"
          fi

          {
            printf 'ref=%s\n' "$OUTPUT_REF"
            printf 'profile=%s\n' "$PROFILE"
            printf 'job_id=%s\n' "$JOB_ID"
            printf 'autofix=%s\n' "$AUTOFIX"
            printf 'strict_lockfile=%s\n' "$STRICT_LOCKFILE"
          } >> "$GITHUB_OUTPUT"

          echo "Authorized $PROFILE build ref $REF as commit $RESOLVED_SHA."

  build:
    name: Dispatch → EAS Build (reusable)
    needs: resolve
    permissions:
      contents: write
    uses: ./.github/workflows/eas-build.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      profile: ${{ needs.resolve.outputs.profile }}
      job_id: ${{ needs.resolve.outputs.job_id }}
      platform: android
      autofix: ${{ fromJSON(needs.resolve.outputs.autofix) }}
      strict_lockfile: ${{ needs.resolve.outputs.strict_lockfile }}
    secrets: inherit
