name: Security audit report

on:
  push:
    branches: ["security/npm-lockfile-refresh"]

permissions:
  contents: write

concurrency:
  group: security-audit-report
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: security/npm-lockfile-refresh

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile from declared security constraints
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from regenerated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate detailed machine-readable audit report
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json || true
          npm ls ws undici tar shell-quote fast-uri form-data js-yaml brace-expansion @babel/core --json > /tmp/npm-ls-security.json
          node <<'NODE'
          const fs = require('fs');
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const all = read('/tmp/npm-audit-all.json');
          const prod = read('/tmp/npm-audit-prod.json');
          const dependencyTree = read('/tmp/npm-ls-security.json');
          const summarize = audit => Object.entries(audit.vulnerabilities ?? {})
            .map(([name, vulnerability]) => ({
              name,
              severity: vulnerability.severity,
              isDirect: vulnerability.isDirect,
              range: vulnerability.range,
              via: (vulnerability.via ?? []).map(item => typeof item === 'string'
                ? { dependency: item }
                : {
                    source: item.source,
                    name: item.name,
                    title: item.title,
                    url: item.url,
                    severity: item.severity,
                    range: item.range,
                  }),
              effects: vulnerability.effects ?? [],
              nodes: vulnerability.nodes ?? [],
              fixAvailable: vulnerability.fixAvailable ?? false,
            }))
            .sort((a, b) => a.name.localeCompare(b.name));
          const packageJson = require('./package.json');
          const lock = require('./package-lock.json');
          const trackedPackages = ['ws', 'undici', 'tar', 'shell-quote', 'fast-uri', 'form-data', 'js-yaml', 'brace-expansion', '@babel/core'];
          const locked = Object.fromEntries(trackedPackages.map(name => [
            name,
            Object.entries(lock.packages ?? {})
              .filter(([path]) => path === `node_modules/${name}` || path.endsWith(`/node_modules/${name}`))
              .map(([path, value]) => ({ path, version: value.version })),
          ]));
          const report = {
            generatedAt: new Date().toISOString(),
            node: process.version,
            npm: process.env.npm_config_user_agent,
            all: {
              vulnerabilities: all.metadata?.vulnerabilities ?? null,
              dependencyCounts: all.metadata?.dependencies ?? null,
              details: summarize(all),
              error: all.error ?? null,
            },
            production: {
              vulnerabilities: prod.metadata?.vulnerabilities ?? null,
              dependencyCounts: prod.metadata?.dependencies ?? null,
              details: summarize(prod),
              error: prod.error ?? null,
            },
            declared: {
              babelCore: packageJson.devDependencies?.['@babel/core'] ?? null,
              overrides: packageJson.overrides ?? null,
            },
            locked,
            dependencyTree,
          };
          fs.writeFileSync('.security-audit-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Commit regenerated lockfile and temporary report
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git add package-lock.json .security-audit-report.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: regenerate lockfile and audit report"
          git push origin HEAD:security/npm-lockfile-refresh
