name: Security override diagnostic

on:
  push:
    branches: ["security/npm-lockfile-refresh"]

permissions:
  contents: write

concurrency:
  group: security-override-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout security branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: security/npm-lockfile-refresh

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Capture lockfile regeneration result
        id: regenerate
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund > /tmp/security-install.log 2>&1
          STATUS=$?
          set -e
          {
            printf 'exit_status=%s\n' "$STATUS"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n\n' "$(npm --version)"
            cat /tmp/security-install.log
          } > .security-install-report.txt
          printf 'status=%s\n' "$STATUS" >> "$GITHUB_OUTPUT"

      - name: Commit temporary diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git add .security-install-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture temporary override diagnostic"
          git push origin HEAD:security/npm-lockfile-refresh

      - name: Fail after preserving diagnostics
        if: steps.regenerate.outputs.status != '0'
        run: exit 1
