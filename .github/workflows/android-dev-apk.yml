name: Android Dev APK

on:
  workflow_dispatch:
  push:
    branches: [Emergent]
    paths:
      - 'App.tsx'
      - 'app.config.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'tsconfig.json'
      - 'components/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'modules/**'
      - 'navigation/**'
      - 'screens/**'
      - 'services/**'
      - 'types/**'
      - 'utils/**'
      - '.github/workflows/android-dev-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-dev-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: '1'
  EAS_BUILD_PROFILE: development
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m

jobs:
  android-dev-apk:
    name: Build Android development APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use JDK 17 from runner
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          java -version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Lint
        run: npm run lint:ci

      - name: Prebuild Android project
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo prebuild --platform android --clean --non-interactive

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug development APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/android-dev
          APK_PATH="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" build-artifacts/android-dev/k1w1-musikplayer-dev-debug.apk
          ls -lh build-artifacts/android-dev

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1w1-musikplayer-dev-debug-apk
          path: build-artifacts/android-dev/k1w1-musikplayer-dev-debug.apk
          if-no-files-found: error
          retention-days: 14
