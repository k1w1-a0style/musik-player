name: Apply Final Pre-Build Hardening

on:
  push:
    branches:
      - fix/final-prebuild-hardening-2026-08-08

permissions:
  contents: write

jobs:
  apply:
    name: Apply verified hardening patch
    if: github.ref == 'refs/heads/fix/final-prebuild-hardening-2026-08-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Apply verified patch and self-remove
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/final-prebuild-hardening-2026-08-08
          EXPECTED_PARENT: 877b812c3dcc764f4b7478742656d781b33ccb03
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$EXPECTED_PARENT" ]; then
            echo "::error::Unexpected branch parent $actual_parent; refusing to apply patch."
            exit 1
          fi

          cat > /tmp/hardening.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/hardening.patch.gz.b64 | gzip -d > /tmp/hardening.patch
          echo 'e4029a9fd280f3951f3db3837427f4befe0ff2badb6beeba06c008a70ff37caa  /tmp/hardening.patch' | sha256sum -c -
          git apply --check /tmp/hardening.patch
          git apply /tmp/hardening.patch
          rm -f .github/workflows/apply-final-hardening-2026-08-08.yml

          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('package-lock.json','utf8'));"
          grep -Fq '"tar@^7.0.0": "7.5.22"' package.json
          grep -Fq '"version": "7.5.22"' package-lock.json
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close final pre-build hardening gaps'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"
