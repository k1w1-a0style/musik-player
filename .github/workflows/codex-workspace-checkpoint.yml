name: Codex source and dependency checkpoint
on:
  push:
    branches: [codex]
    paths: [".github/workflows/codex-workspace-checkpoint.yml"]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir -p workspace-checkpoint
          git archive --format=tar HEAD | gzip > workspace-checkpoint/source.tar.gz
          git rev-parse HEAD > workspace-checkpoint/source-commit.txt
      - uses: ./.github/actions/setup-npm
      - name: Archive npm content cache for an offline clean install
        run: |
          tar -czf workspace-checkpoint/npm-cache.tar.gz -C "$HOME/.npm" _cacache
          cd workspace-checkpoint
          sha256sum source.tar.gz npm-cache.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-workspace-${{ github.sha }}
          path: workspace-checkpoint/
          retention-days: 3
          if-no-files-found: error
